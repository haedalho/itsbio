name: Patch Kent verified gallery gate

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/patch-kent-gallery-verification.mjs
      - .github/workflows/patch-kent-gallery-verification.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/kent-preflight
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/patch-kent-gallery-verification.mjs

      - name: Commit patched files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/products/KentProductGalleryClient.tsx components/products/KentProductDetailClientV2.tsx 'app/products/kent/item/[...slug]/page.tsx'
          if git diff --cached --quiet; then
            echo "No gallery changes"
            exit 0
          fi
          git commit -m "Gate Kent multi-image galleries on verified snapshots"
          git push origin HEAD:agent/kent-preflight
