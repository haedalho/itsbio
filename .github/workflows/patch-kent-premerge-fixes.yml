name: Patch Kent premerge rendering fixes

on:
  push:
    branches:
      - agent/homepage-brand-redesign
    paths:
      - .github/workflows/patch-kent-premerge-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homepage-brand-redesign
          fetch-depth: 0

      - name: Repair Kent escaped specification tables and remove Print UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/kent/source-content.ts')
          source = path.read_text()

          if 'const PRINT_UI_TEXT_RE' not in source:
              source, count = re.subn(
                  r'(const COMMERCE_TEXT_RE = /[^\n]+/i;)',
                  r'\1\nconst PRINT_UI_TEXT_RE = /^(?:print|print page|print this page)$/i;',
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'Could not insert PRINT_UI_TEXT_RE: {count}')

          old_condition = 'if (COMMERCE_TEXT_RE.test(text) || PRICE_TEXT_RE.test(text) || MONEY_RE.test(text) || NO_CHARGE_RE.test(text)) {'
          new_condition = 'if (COMMERCE_TEXT_RE.test(text) || PRINT_UI_TEXT_RE.test(text) || PRICE_TEXT_RE.test(text) || MONEY_RE.test(text) || NO_CHARGE_RE.test(text)) {'
          if old_condition in source:
              source = source.replace(old_condition, new_condition)
          elif new_condition not in source:
              raise SystemExit('Could not patch Kent UI-noise condition')

          old_sanitizer = '''export function sanitizeKentSourceHtml(input: unknown) {
            const raw = typeof input === "string" ? input.trim() : "";
            if (!raw) return "";
          '''
          helper_and_sanitizer = '''function decodeEscapedKentMarkup(input: string) {
            let value = input;
            for (let pass = 0; pass < 2; pass += 1) {
              const ampDecoded = value.replace(/&amp;/gi, "&");
              const hasEncodedTableMarkup = /(?:&lt;|&#0*60;|&#x0*3c;)\\s*\\/?\\s*(?:table|thead|tbody|tfoot|tr|th|td)\\b/i.test(ampDecoded);
              if (!hasEncodedTableMarkup) break;
              value = ampDecoded
                .replace(/&lt;/gi, "<")
                .replace(/&gt;/gi, ">")
                .replace(/&quot;/gi, '\"')
                .replace(/&#(?:39|x27);/gi, "'");
            }
            return value;
          }

          export function sanitizeKentSourceHtml(input: unknown) {
            const raw = decodeEscapedKentMarkup(typeof input === "string" ? input.trim() : "");
            if (!raw) return "";
          '''
          if old_sanitizer in source:
              source = source.replace(old_sanitizer, helper_and_sanitizer)
          elif 'function decodeEscapedKentMarkup' not in source:
              raise SystemExit('Could not insert escaped Kent markup decoder')

          path.write_text(source)

          # Guard the Products mega menu: all previously supported brands must remain.
          menu = Path('components/site/ProductsMegaMenu.tsx').read_text()
          required = [
              'key: "abm"', 'key: "kent"', 'key: "itschem"', 'key: "aims"',
              'key: "seedburo"', 'key: "bioplastics"', 'key: "cleaver"',
              'key: "cellfree"', 'key: "plaslabs"', 'key: "affinity"', 'key: "dogen"',
          ]
          missing = [item for item in required if item not in menu]
          if missing:
              raise SystemExit(f'Products mega menu lost brands: {missing}')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/kent/source-content.ts
          if git diff --cached --quiet; then
            echo "Kent repair already applied"
            exit 0
          fi
          git commit -m "Fix Kent specs rendering and remove Print UI"
          git push origin HEAD:agent/homepage-brand-redesign
