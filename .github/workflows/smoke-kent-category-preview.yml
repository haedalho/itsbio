name: Smoke test Kent category preview

on:
  pull_request:
    branches:
      - agent/kent-preflight
    paths:
      - .github/workflows/smoke-kent-category-preview.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2025-02-19
      VERCEL_ENV: preview
      VERCEL_GIT_COMMIT_REF: agent/kent-sanity-images-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build preview app
        run: npm run build

      - name: Start preview app
        run: |
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/itsbio-next.log 2>&1 &
          echo $! > /tmp/itsbio-next.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/itsbio-next.log
          exit 1

      - name: Verify all Kent category routes and card images
        run: |
          node <<'NODE'
          const projectId = '9b5twpc8';
          const dataset = 'production';
          const apiVersion = '2025-02-19';
          const query = `*[_type=="category" && (!defined(isActive) || isActive==true) && (brand->themeKey=="kent" || brand->slug.current=="kent" || themeKey=="kent" || brandSlug=="kent") && defined(path)]{path}`;
          const sanityUrl = new URL(`https://${projectId}.api.sanity.io/v${apiVersion}/data/query/${dataset}`);
          sanityUrl.searchParams.set('query', query);
          const sanityResponse = await fetch(sanityUrl);
          if (!sanityResponse.ok) throw new Error(`Sanity ${sanityResponse.status}`);
          const categories = (await sanityResponse.json()).result || [];
          const failures = [];

          for (const category of categories) {
            const path = Array.isArray(category.path) ? category.path.filter(Boolean).join('/') : '';
            if (!path) continue;
            const url = `http://127.0.0.1:3000/products/kent/${path}`;
            const response = await fetch(url, { redirect: 'follow' });
            const html = await response.text();
            if (!response.ok || !html.includes('Kent Scientific')) {
              failures.push({ path, status: response.status, finalUrl: response.url });
            }
          }

          const handling = await fetch('http://127.0.0.1:3000/products/kent/laboratory-animal-handling');
          const html = await handling.text();
          const sanityImages = (html.match(/cdn\.sanity\.io/g) || []).length;
          const hasHandlingCards = ['Laboratory Animal Handling', 'Animal Holders', 'Clippers', 'Scales']
            .every((label) => html.includes(label));

          console.log(JSON.stringify({ categoryCount: categories.length, failures, handlingStatus: handling.status, sanityImages, hasHandlingCards }, null, 2));
          if (failures.length) throw new Error(`${failures.length} Kent category routes failed`);
          if (!handling.ok) throw new Error(`Animal Handling HTTP ${handling.status}`);
          if (!hasHandlingCards) throw new Error('Animal Handling category cards are missing');
          if (sanityImages < 4) throw new Error(`Animal Handling only rendered ${sanityImages} Sanity image references`);
          NODE

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/itsbio-next.log || true
