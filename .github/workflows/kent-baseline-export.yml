name: Export Kent baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - app/api/kent/baseline-export/route.ts
      - .github/workflows/kent-baseline-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4

      - name: Wait for preview and download baseline
        shell: bash
        run: |
          set -euo pipefail
          URL="https://itsbio-git-agent-kent-preflight-hadel-hos-projects.vercel.app/api/kent/baseline-export"
          mkdir -p data
          success=0
          for attempt in $(seq 1 40); do
            echo "Attempt ${attempt}: ${URL}"
            if curl --fail --silent --show-error --location "$URL" -o /tmp/kent-baseline.json; then
              if node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/kent-baseline.json","utf8")); if(!Array.isArray(x.products)||x.products.length<1) process.exit(2); console.log(`Fetched ${x.products.length} Kent rows`);'; then
                success=1
                break
              fi
            fi
            sleep 15
          done
          test "$success" = "1"

      - name: Generate JSON CSV and Markdown
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/kent-baseline.json', 'utf8'));
          const rows = Array.isArray(report.products) ? report.products : [];
          const clean = rows.map((row, index) => ({
            index: index + 1,
            sanityId: row._id || '',
            title: row.title || '',
            slug: row.slug || '',
            sku: row.sku || '',
            sourceUrl: row.sourceUrl || '',
            categoryPath: Array.isArray(row.categoryPath) ? row.categoryPath : [],
            categoryPathTitles: Array.isArray(row.categoryPathTitles) ? row.categoryPathTitles : [],
            listingPaths: Array.isArray(row.listingPaths) ? row.listingPaths : [],
            productType: row.productType || '',
            isActive: row.isActive !== false,
            recordType: row.recordType || 'PRODUCT',
            verificationStatus: row.verificationStatus || 'UNVERIFIED',
            galleryAssetCount: Number(row.galleryAssetCount || 0),
            galleryImageUrlCount: Number(row.galleryImageUrlCount || 0),
            rawImageUrlCount: Number(row.rawImageUrlCount || 0),
            sectionCount: Number(row.sectionCount || 0),
            variantCount: Number(row.variantCount || 0),
            optionGroupCount: Number(row.optionGroupCount || 0),
            officialTitle: '',
            officialSubtitle: '',
            officialSku: '',
            officialSourceUrl: '',
            officialGalleryCount: null,
            officialSectionCount: null,
            verifiedAt: '',
            notes: '',
          }));
          const output = {
            generatedAt: report.generatedAt,
            source: report.source,
            total: clean.length,
            counts: report.counts || {},
            statusCounts: {
              VERIFIED: 0,
              NEEDS_FIX: 0,
              UNRESOLVED: 0,
              EXCLUDE: clean.filter((row) => row.recordType === 'EXCLUDE_WARRANTY').length,
              UNVERIFIED: clean.filter((row) => row.recordType !== 'EXCLUDE_WARRANTY').length,
            },
            products: clean,
          };
          fs.mkdirSync('data', { recursive: true });
          fs.writeFileSync('data/kent-product-baseline.json', JSON.stringify(output, null, 2) + '\n');

          const columns = ['index','sanityId','title','slug','sku','sourceUrl','categoryPath','productType','isActive','recordType','verificationStatus','galleryAssetCount','galleryImageUrlCount','rawImageUrlCount','sectionCount','variantCount','optionGroupCount','officialTitle','officialSubtitle','officialSku','officialSourceUrl','officialGalleryCount','officialSectionCount','verifiedAt','notes'];
          const csvCell = (value) => {
            const text = Array.isArray(value) ? value.join(' > ') : value == null ? '' : String(value);
            return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
          };
          fs.writeFileSync('data/kent-product-baseline.csv', [columns.join(','), ...clean.map((row) => columns.map((key) => csvCell(row[key])).join(','))].join('\n') + '\n');

          const counts = output.statusCounts;
          fs.writeFileSync('data/kent-product-baseline.md', [
            '# Kent product baseline',
            '',
            `Generated: ${output.generatedAt}`,
            '',
            `- Total Sanity rows: ${output.total}`,
            `- Product candidates: ${clean.filter((row) => row.recordType === 'PRODUCT').length}`,
            `- Warranty exclusions: ${clean.filter((row) => row.recordType === 'EXCLUDE_WARRANTY').length}`,
            `- Service review: ${clean.filter((row) => row.recordType === 'REVIEW_SERVICE').length}`,
            `- Verified: ${counts.VERIFIED}`,
            `- Needs fix: ${counts.NEEDS_FIX}`,
            `- Unresolved: ${counts.UNRESOLVED}`,
            `- Unverified: ${counts.UNVERIFIED}`,
            '',
            '| # | Product | Slug | Item # | Record type | Status | Source URL |',
            '|---:|---|---|---|---|---|---|',
            ...clean.map((row) => `| ${row.index} | ${String(row.title).replace(/\|/g,'\\|')} | ${row.slug} | ${row.sku} | ${row.recordType} | ${row.verificationStatus} | ${row.sourceUrl || ''} |`),
            '',
          ].join('\n'));
          NODE

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: kent-product-baseline
          path: |
            data/kent-product-baseline.json
            data/kent-product-baseline.csv
            data/kent-product-baseline.md
          if-no-files-found: error
