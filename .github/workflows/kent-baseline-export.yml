name: Export Kent baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/kent-product-baseline-export.mjs
      - .github/workflows/kent-baseline-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4

      - name: Generate Kent baseline
        run: node scripts/kent-product-baseline-export.mjs

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: kent-product-baseline
          path: |
            data/kent-product-baseline.json
            data/kent-product-baseline.csv
            data/kent-product-baseline.md
          if-no-files-found: error
