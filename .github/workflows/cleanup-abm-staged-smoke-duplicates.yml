name: Cleanup ABM staged smoke duplicates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleanup-abm-staged-smoke-duplicates
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate and remove the two obsolete smoke-test chunks
        run: node scripts/cleanup-abm-staged-smoke-duplicates.mjs --apply
      - name: Verify complete staged route coverage
        run: npm run abm:staged-links:audit
