name: Validate and publish complete Cleaver manufacturer content

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-cleaver-content.yml
      - scripts/migrate-cleaver-content-to-sanity.mjs
      - scripts/migrate-cleaver-thistle-sections-to-sanity.mjs
  pull_request:
    paths:
      - .github/workflows/migrate-cleaver-content.yml
      - scripts/migrate-cleaver-thistle-sections-to-sanity.mjs
      - lib/cleaver/**
      - components/products/CleaverProductSections.tsx
      - app/products/cleaver/item/**
      - studio-admin/schemaTypes/product.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleaver-product-content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-thistle-six-sections:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install reviewed project dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Overview, Specifications, What's Included, Documents, All Variations, Accessories and video discovery
        run: node scripts/migrate-cleaver-thistle-sections-to-sanity.mjs

  publish-reviewed-cleaver-content:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install reviewed project dependencies
        run: npm install --no-audit --no-fund
      - name: Import exact-SKU descriptions, specifications, PDFs, and high-resolution galleries
        run: node scripts/migrate-cleaver-content-to-sanity.mjs --apply
      - name: Import complete Thistle product sections and verify the microDOC reference fixture
        run: node scripts/migrate-cleaver-thistle-sections-to-sanity.mjs --apply
