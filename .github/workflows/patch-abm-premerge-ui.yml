name: Patch ABM premerge UI

on:
  push:
    branches:
      - agent/homepage-brand-redesign
    paths:
      - .github/workflows/patch-abm-premerge-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homepage-brand-redesign
          fetch-depth: 0

      - name: Fix ABM Print text and specification alignment
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/site/HtmlContent.tsx')
          source = path.read_text()

          old = '''      txt.includes("blog") ||
      txt === "kr" ||'''
          new = '''      txt.includes("blog") ||
      txt === "print" ||
      txt === "print page" ||
      txt === "print this page" ||
      txt === "kr" ||'''
          if old in source:
              source = source.replace(old, new, 1)
          elif 'txt === "print" ||' not in source:
              raise SystemExit('Could not add ABM Print link filtering')

          old = '''    table.querySelectorAll("td, th").forEach((cell) => {
      const text = collapseWs(cell.textContent || "");
      if (/^(?:US|CA)?\\$\\s?\\d[\\d,.]*(?:\\s*(?:USD|CAD))?$/i.test(text)) cell.textContent = "";
      ["style", "width", "height", "bgcolor", "border", "cellpadding", "cellspacing", "align", "valign"].forEach((attribute) => cell.removeAttribute(attribute));
    });'''
          new = '''    table.querySelectorAll("td, th").forEach((cell) => {
      let text = collapseWs(cell.textContent || "");
      if (isAbmMode && /\\s+Print$/i.test(text)) {
        const withoutPrint = text.replace(/\\s+Print$/i, "").trim();
        cell.textContent = withoutPrint;
        text = withoutPrint;
      }
      if (/^(?:US|CA)?\\$\\s?\\d[\\d,.]*(?:\\s*(?:USD|CAD))?$/i.test(text)) cell.textContent = "";
      ["style", "width", "height", "bgcolor", "border", "cellpadding", "cellspacing", "align", "valign"].forEach((attribute) => cell.removeAttribute(attribute));
    });'''
          if old in source:
              source = source.replace(old, new, 1)
          elif 'withoutPrint' not in source:
              raise SystemExit('Could not add ABM cell Print cleanup')

          old = '''    if (isAbmMode) {
      table.setAttribute("class", TABLE_CLASS);'''
          new = '''    if (isAbmMode) {
      const columnCounts = rows.map((row) => Array.from(row.children).length).filter(Boolean);
      const isTwoColumnTable = columnCounts.length > 0 && columnCounts.every((count) => count <= 2) && columnCounts.some((count) => count === 2);
      table.setAttribute("class", `${TABLE_CLASS}${isTwoColumnTable ? " abm-two-column-table" : ""}`);'''
          if old in source:
              source = source.replace(old, new, 1)
          elif 'abm-two-column-table' not in source:
              raise SystemExit('Could not add ABM two-column table class')

          old = '''.itsbio-html h2,.itsbio-html h3{margin-top:1.4em;margin-bottom:.6em}
`;'''
          new = '''.itsbio-html h2,.itsbio-html h3{margin-top:1.4em;margin-bottom:.6em}
.itsbio-html .abm-table-scroll{width:100%;max-width:100%;overflow-x:auto}
.itsbio-html .abm-data-table{width:100%!important;max-width:100%;margin:0!important;border-collapse:collapse;table-layout:auto;text-align:left}
.itsbio-html .abm-data-table th,.itsbio-html .abm-data-table td{text-align:left!important;vertical-align:top!important}
.itsbio-html .abm-two-column-table{table-layout:fixed}
.itsbio-html .abm-two-column-table tr > :first-child{width:34%}
.itsbio-html .abm-two-column-table tr > :nth-child(2){width:66%}
`;'''
          if old in source:
              source = source.replace(old, new, 1)
          elif '.abm-two-column-table tr > :first-child' not in source:
              raise SystemExit('Could not add ABM table layout CSS')

          path.write_text(source)
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/site/HtmlContent.tsx
          if git diff --cached --quiet; then
            echo "ABM UI repair already applied"
            exit 0
          fi
          git commit -m "Fix ABM specs layout and remove Print labels"
          git push origin HEAD:agent/homepage-brand-redesign
