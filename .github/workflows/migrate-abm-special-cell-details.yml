name: Migrate ABM Special Cell product details

on:
  push:
    branches:
      - agent/abm-cellular-category-design
    paths:
      - .github/workflows/migrate-abm-special-cell-details.yml
      - scripts/prepare-abm-special-cell-detail-migration.mjs
      - scripts/audit-abm-special-cell-detail-migration.mjs
      - scripts/stage-abm-rebuild-details.mjs
      - scripts/lib/abm-sanity-image-assets.mjs
  workflow_dispatch:
    inputs:
      workers:
        description: Concurrent official detail requests
        required: true
        default: "2"
        type: choice
        options: ["1", "2"]
      gap_ms:
        description: Minimum delay between official detail requests
        required: true
        default: "350"
        type: string

permissions:
  contents: read

concurrency:
  group: abm-special-cell-detail-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 180
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      ABM_REBUILD_VERSION: 2026-08-09-search-v5
      ABM_SPECIAL_CELL_BATCH_KEY: special-cell-20260909
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund

      - id: prepare
        name: Resolve missing collection products against official ABM search
        continue-on-error: true
        env:
          ABM_SEARCH_WORKERS: "2"
          ABM_SEARCH_GAP_MS: "350"
        run: node scripts/prepare-abm-special-cell-detail-migration.mjs

      - id: collect
        name: Collect and parse official product details
        if: hashFiles('.cache/abm-special-cell-detail-migration/inventory.json') != ''
        continue-on-error: true
        env:
          ABM_INVENTORY_FILE: .cache/abm-special-cell-detail-migration/inventory.json
        run: >-
          node scripts/abm-full-detail-collect-runner.mjs
          --workers ${{ inputs.workers || '2' }}
          --gap-ms ${{ inputs.gap_ms || '350' }}

      - name: Retain exact records and append verified collection-table fallbacks
        if: always() && hashFiles('.cache/abm-full-detail-collect/products.json') != ''
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = '.cache/abm-full-detail-collect/products.json';
          const rows = JSON.parse(fs.readFileSync(file, 'utf8'));
          const valid = rows.filter((row) => row?.status === 'ok' && row?.qa?.skuMatch === true && row?.qa?.priceLeak === false);
          const inventory = JSON.parse(fs.readFileSync('.cache/abm-special-cell-detail-migration/inventory.json', 'utf8'));
          const fallbacks = (inventory.categoryFallbackRows || []).filter((row) => row?.status === 'ok' && row?.qa?.skuMatch === true && row?.qa?.priceLeak === false);
          const merged = [...valid, ...fallbacks];
          fs.writeFileSync(file, JSON.stringify(merged, null, 2));
          console.log(`Verified records retained: ${valid.length}/${rows.length}; official collection-table fallbacks: ${fallbacks.length}; total: ${merged.length}`);
          NODE

      - name: Create pre-upload official image census and Sanity asset projection
        if: always() && hashFiles('.cache/abm-full-detail-collect/products.json') != ''
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createClient } from 'next-sanity';
          const rows = JSON.parse(fs.readFileSync('.cache/abm-full-detail-collect/products.json', 'utf8'));
          const urls = rows.flatMap((row) => row?.detail?.images || []).filter(Boolean);
          const uniqueUrls = [...new Set(urls)];
          const client = createClient({
            projectId: process.env.NEXT_PUBLIC_SANITY_PROJECT_ID,
            dataset: process.env.NEXT_PUBLIC_SANITY_DATASET,
            apiVersion: process.env.NEXT_PUBLIC_SANITY_API_VERSION,
            useCdn: false,
          });
          const currentSanityImageAssets = await client.fetch('count(*[_type == "sanity.imageAsset"])');
          const report = {
            generatedAt: new Date().toISOString(),
            products: rows.length,
            productsWithOfficialImages: rows.filter((row) => (row?.detail?.images || []).length > 0).length,
            officialImageReferences: urls.length,
            uniqueOfficialImageUrls: uniqueUrls.length,
            currentSanityImageAssets,
            maximumProjectedSanityImageAssets: currentSanityImageAssets + uniqueUrls.length,
            placeholderImages: 0,
          };
          fs.writeFileSync('.cache/abm-special-cell-detail-migration/image-census.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Stage exact details and rehost official images in Sanity
        if: always() && hashFiles('.cache/abm-full-detail-collect/products.json') != ''
        run: >-
          node scripts/stage-abm-rebuild-details.mjs
          --products .cache/abm-full-detail-collect/products.json
          --services .cache/abm-full-detail-collect/services.json
          --allow-partial
          --batch-key special-cell-20260909
          --version 2026-08-09-search-v5

      - name: Audit exact coverage, content, commerce leaks, and managed images
        if: always() && hashFiles('.cache/abm-special-cell-detail-migration/inventory.json') != ''
        run: node scripts/audit-abm-special-cell-detail-migration.mjs

      - name: Fail incomplete source resolution or collection
        if: always()
        run: |
          if [ "${{ steps.prepare.outcome }}" != "success" ] || [ "${{ steps.collect.outcome }}" != "success" ]; then
            echo "The valid subset was staged, but the migration remains incomplete and must be retried."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abm-special-cell-detail-migration-${{ github.run_id }}
          path: |
            .cache/abm-special-cell-detail-migration/
            .cache/abm-full-detail-collect/summary.json
            .cache/abm-full-detail-collect/product-review.json
            .cache/abm-rebuild-detail-staging/report.json
          retention-days: 30
          if-no-files-found: warn
