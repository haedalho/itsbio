name: Repair unmatched Cleaver source identities

on:
  push:
    branches:
      - agent/cleaver-full-thistle-sections
    paths:
      - scripts/repair-cleaver-unmatched-source-map.mjs
      - .github/workflows/repair-cleaver-unmatched-source-map.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleaver-unmatched-source-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-unmatched-cleaver-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Search unmatched reviewed products by conservative manufacturer-title match
        run: node scripts/repair-cleaver-unmatched-source-map.mjs
      - name: Commit recovered manufacturer identities
        shell: bash
        run: |
          if git diff --quiet -- data/cleaver-source-map.json; then
            echo "No additional exact/near-exact manufacturer identities recovered."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cleaver-source-map.json
          git commit -m "Recover unmatched Cleaver manufacturer identities"
          git push origin HEAD:${{ github.ref_name }}
