name: Legacy Notice HTML Audit

on:
  push:
    branches:
      - agent/notice-html-fidelity
    paths:
      - .github/workflows/legacy-notice-html-audit.yml
      - scripts/backfill-legacy-notice-html.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notice-html-fidelity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Dry-run legacy HTML extraction
        run: node scripts/backfill-legacy-notice-html.mjs
      - name: Save audit report
        run: |
          mkdir -p docs/migration-reports
          cp .cache/legacy-notice-html/latest.md docs/migration-reports/legacy-notice-html-audit.md
          cp .cache/legacy-notice-html/latest.json docs/migration-reports/legacy-notice-html-audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration-reports/legacy-notice-html-audit.*
          git commit -m "Record legacy Notice HTML fidelity audit" || exit 0
          git push origin HEAD:agent/notice-html-fidelity
