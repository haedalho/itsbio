name: Temporary shared search terms
on:
  push:
    branches: [agent/logo-loading-overlay]
permissions:
  contents: write
jobs:
  run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/logo-loading-overlay
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/_find-shared-search-terms.mjs
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/_shared-search-terms-temp.json
          git commit -m 'chore: record temporary shared search terms'
          git push origin HEAD:agent/logo-loading-overlay
