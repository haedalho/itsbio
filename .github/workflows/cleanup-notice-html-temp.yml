name: Cleanup Notice HTML Temp Files

on:
  push:
    branches:
      - agent/notice-html-fidelity
    paths:
      - .github/workflows/cleanup-notice-html-temp.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notice-html-fidelity
          fetch-depth: 0
      - name: Remove temporary workflows and reports
        run: |
          git rm -f \
            .github/workflows/apply-legacy-notice-html.yml \
            .github/workflows/apply-legacy-notice-renderer.yml \
            .github/workflows/delete-obvious-test-notices.yml \
            .github/workflows/legacy-notice-html-audit.yml \
            .github/workflows/notice-test-audit.yml \
            .github/workflows/cleanup-notice-html-temp.yml \
            docs/migration-reports/legacy-notice-html-applied.md \
            docs/migration-reports/legacy-notice-html-audit.json \
            docs/migration-reports/legacy-notice-html-audit.md \
            docs/migration-reports/nonlegacy-after-test-cleanup.md \
            docs/migration-reports/recent-nonlegacy-notices.json \
            docs/migration-reports/recent-nonlegacy-notices.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary Notice migration audit files"
          git push origin HEAD:agent/notice-html-fidelity
