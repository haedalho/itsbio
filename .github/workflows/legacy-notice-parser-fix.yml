name: Legacy Notice Parser Fix

on:
  push:
    branches:
      - agent/notice-legacy-migration
    paths:
      - .github/workflows/legacy-notice-parser-fix.yml

permissions:
  contents: write

jobs:
  fix-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notice-legacy-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund

      - name: Fix body root, content images and binary upload
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('scripts/migrate-legacy-notices.mjs')
          s = p.read_text()

          s = re.sub(
            r'function pickContentRoot\(\$\) \{.*?\n\}',
            '''function pickContentRoot($) {
  const exact = $("#mb_board01_tr_content > td.content-box").first();
  if (exact.length) return exact;
  const rowCell = $("tr[id$=\\"_tr_content\\"] > td").first();
  if (rowCell.length) return rowCell;
  const fallback = $(".content-box, .view-content, .entry-content").first();
  return fallback.length ? fallback : $("body");
}''',
            s,
            count=1,
            flags=re.S,
          )

          s = re.sub(
            r'function findImages\(\$, root, sourceUrl\) \{.*?\n\}',
            '''function findImages($, root, sourceUrl) {
  const urls = [];
  root.find("img").each((_, img) => {
    const src = $(img).attr("data-src") || $(img).attr("data-lazy-src") || $(img).attr("src") || "";
    if (!src || /^data:/i.test(src)) return;
    const width = Number.parseInt($(img).attr("width") || "", 10) || 0;
    const height = Number.parseInt($(img).attr("height") || "", 10) || 0;
    try {
      const absolute = new URL(src, sourceUrl).toString();
      const fingerprint = `${absolute} ${$(img).attr("class") || ""} ${$(img).attr("alt") || ""}`;
      if (/logo|icon|flag|spinner|avatar|level|arrow\\.png|tracking|pixel|spacer|blank\\.(?:gif|png)/i.test(fingerprint)) return;
      if (width > 0 && height > 0 && width <= 16 && height <= 16) return;
      if (!urls.includes(absolute)) urls.push(absolute);
    } catch {}
  });
  return urls.slice(0, 20);
}''',
            s,
            count=1,
            flags=re.S,
          )

          marker = 'async function uploadImage(url, filenameHint) {'
          if 'async function fetchBinaryWithRetry' not in s:
            binary = '''async function fetchBinaryWithRetry(url, { attempts = 2, timeoutMs = 20000 } = {}) {
  let lastError;
  for (let attempt = 1; attempt <= attempts; attempt += 1) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(url, {
        signal: controller.signal,
        redirect: "follow",
        headers: { "user-agent": "Mozilla/5.0 (compatible; ITS-BIO-Legacy-Migration/1.0)" },
      });
      clearTimeout(timer);
      if (!response.ok) throw new Error(`HTTP ${response.status} for ${url}`);
      const contentType = response.headers.get("content-type") || "application/octet-stream";
      const buffer = Buffer.from(await response.arrayBuffer());
      return { contentType, buffer };
    } catch (error) {
      clearTimeout(timer);
      lastError = error;
    }
    if (attempt < attempts) await sleep(700 * attempt);
  }
  throw lastError || new Error(`Failed binary fetch ${url}`);
}

'''
            s = s.replace(marker, binary + marker, 1)

          old = '''    const { response } = await fetchWithRetry(url, { attempts: 2, timeoutMs: 20000 });
    const contentType = response.headers.get("content-type") || "image/jpeg";
    if (!contentType.startsWith("image/")) return null;
    const buffer = Buffer.from(await response.arrayBuffer());'''
          new = '''    const { contentType, buffer } = await fetchBinaryWithRetry(url, { attempts: 2, timeoutMs: 20000 });
    if (!contentType.startsWith("image/")) return null;'''
          if old not in s and 'fetchBinaryWithRetry(url' not in s[s.index(marker):s.index(marker)+500]:
            raise SystemExit('Could not patch binary image fetch')
          s = s.replace(old, new, 1)

          # Add richer report diagnostics without changing document writes.
          old_report = 'records: unique.map(({ body, ...record }) => ({ ...record, bodyBlocks: body.length })),'
          new_report = 'records: unique.map(({ body, ...record }) => ({ ...record, bodyBlocks: body.length, bodyChars: body.reduce((sum, block) => sum + clean(block?.children?.[0]?.text).length, 0), contentImages: record.images.length })),'
          s = s.replace(old_report, new_report, 1)

          p.write_text(s)
          PY

      - name: Commit parser fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/migrate-legacy-notices.mjs
          git commit -m "Fix legacy Notice body and image extraction" || true
          git push origin HEAD:agent/notice-legacy-migration

      - name: Re-audit all discovered notices
        run: node scripts/migrate-legacy-notices.mjs --max-vid=60

      - name: Persist quality report
        run: |
          mkdir -p docs/migration-reports
          cp .cache/legacy-notice-migration/latest.md docs/migration-reports/legacy-notices-latest.md
          cp .cache/legacy-notice-migration/latest.json docs/migration-reports/legacy-notices-latest.json
          git add docs/migration-reports/legacy-notices-latest.*
          git commit -m "Record improved legacy Notice migration audit" || true
          git push origin HEAD:agent/notice-legacy-migration
