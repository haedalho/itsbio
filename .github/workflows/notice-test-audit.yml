name: Notice Test Audit

on:
  push:
    branches:
      - agent/notice-html-fidelity
    paths:
      - .github/workflows/notice-test-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notice-html-fidelity
          fetch-depth: 0

      - name: Query recent non-legacy Notice documents
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const token=[process.env.SANITY_WRITE_TOKEN,process.env.SANITY_API_WRITE_TOKEN,process.env.SANITY_API_TOKEN,process.env.SANITY_TOKEN,process.env.SANITY_AUTH_TOKEN].find(Boolean);
          const query='*[_type == "notice" && !(_id match "legacy-notice-*")] | order(_createdAt desc)[0...50]{_id,title,_createdAt,publishedAt,"slug":slug.current,isActive}';
          const url=`https://9b5twpc8.api.sanity.io/v2025-01-01/data/query/production?query=${encodeURIComponent(query)}`;
          const r=await fetch(url,{headers:token?{authorization:`Bearer ${token}`}:{}});
          if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
          const payload=await r.json();
          const docs=Array.isArray(payload.result)?payload.result:[];
          await fs.mkdir('docs/migration-reports',{recursive:true});
          await fs.writeFile('docs/migration-reports/recent-nonlegacy-notices.json',JSON.stringify(docs,null,2));
          await fs.writeFile('docs/migration-reports/recent-nonlegacy-notices.md',['# Recent non-legacy Notice documents','',...docs.map(d=>`- ${d._id} · ${d._createdAt||''} · ${JSON.stringify(d.title||'')}`),''].join('\n'));
          console.log(JSON.stringify(docs,null,2));
          NODE

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration-reports/recent-nonlegacy-notices.*
          git commit -m "Record recent non-legacy Notice documents" || exit 0
          git push origin HEAD:agent/notice-html-fidelity
