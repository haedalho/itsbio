name: Inspect Kent official logo

on:
  push:
    branches:
      - agent/homepage-brand-redesign
    paths:
      - .github/workflows/inspect-kent-logo.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch current Kent homepage and extract logo candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request, html
          url='https://www.kentscientific.com/'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (compatible; ITSBIO-Brand-Audit/1.0)'})
          text=urllib.request.urlopen(req, timeout=30).read().decode('utf-8','replace')
          print('HTML_BYTES', len(text))
          imgs=re.findall(r'<img\b[^>]*>', text, flags=re.I)
          matches=[]
          for tag in imgs:
              if re.search(r'logo|kent|scientific', tag, flags=re.I):
                  matches.append(html.unescape(tag))
          print('LOGO_CANDIDATES', len(matches))
          for i,tag in enumerate(matches[:30],1):
              print(f'[{i}] {tag}')
          print('HEADER_SNIPPETS')
          for m in re.finditer(r'<header\b[\s\S]{0,25000}?</header>', text, flags=re.I):
              header=m.group(0)
              for tag in re.findall(r'<img\b[^>]*>', header, flags=re.I):
                  print(html.unescape(tag))
          PY
