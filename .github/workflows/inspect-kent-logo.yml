name: Inspect Kent official logo

on:
  push:
    branches:
      - agent/homepage-brand-redesign
    paths:
      - .github/workflows/inspect-kent-logo.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homepage-brand-redesign
      - name: Inspect current official logo palette
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from collections import Counter
          from PIL import Image
          path='public/partners/KentScientific-logo.png'
          im=Image.open(path).convert('RGBA')
          print('SIZE', im.size)
          pixels=[]
          for r,g,b,a in im.getdata():
              if a < 32:
                  continue
              # Ignore near-white page/background pixels while preserving brand colors.
              if r > 245 and g > 245 and b > 245:
                  continue
              # Quantize slightly to collapse antialiasing variants.
              pixels.append((round(r/8)*8, round(g/8)*8, round(b/8)*8, a))
          counts=Counter(pixels)
          print('TOP_COLORS')
          for (r,g,b,a),count in counts.most_common(16):
              print(f'#{min(r,255):02X}{min(g,255):02X}{min(b,255):02X} alpha={a} count={count}')
          PY
