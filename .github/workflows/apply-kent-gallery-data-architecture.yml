name: Apply Kent gallery data architecture

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/patch-kent-verified-gallery-variant-image.mjs
      - .github/workflows/apply-kent-gallery-data-architecture.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/kent-preflight
          fetch-depth: 0

      - name: Protect official galleries from legacy variant images
        run: node scripts/patch-kent-verified-gallery-variant-image.mjs

      - name: Commit generated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/products/KentProductDetailClientV2.tsx
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Keep legacy variant images out of official galleries"
          git push origin HEAD:agent/kent-preflight
