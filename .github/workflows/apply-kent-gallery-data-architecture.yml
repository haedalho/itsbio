name: Apply Kent gallery data architecture

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/patch-kent-approved-active-gallery.mjs
      - .github/workflows/apply-kent-gallery-data-architecture.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/kent-preflight
          fetch-depth: 0

      - name: Apply approved-gallery source patch
        run: node scripts/patch-kent-approved-active-gallery.mjs

      - name: Commit generated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/products/kent/item/'[...slug]'/page.tsx
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Render approved Kent galleries from active assets"
          git push origin HEAD:agent/kent-preflight
