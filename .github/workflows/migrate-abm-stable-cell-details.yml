name: Migrate ABM Stable Cell Lines details

on:
  push:
    branches:
      - agent/abm-stable-lines-completeness
    paths:
      - .github/workflows/migrate-abm-stable-cell-details.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-abm-stable-cell-details
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Build authoritative Stable detail inventory
        run: node scripts/build-abm-stable-detail-inventory.mjs
      - name: Collect and validate all 1,102 Stable Cell Lines details
        env:
          ABM_INVENTORY_FILE: .cache/abm-stable-detail/inventory.json
        run: node scripts/abm-full-detail-collect.mjs --workers 3 --gap-ms 300
      - name: Stage reviewed Stable details to Sanity Production
        run: node scripts/stage-abm-rebuild-details.mjs --products .cache/abm-full-detail-collect/products.json --services .cache/abm-full-detail-collect/services.json --allow-partial --batch-key stable-cell-lines
      - name: Upload migration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abm-stable-full-migration-${{ github.run_id }}
          path: |
            .cache/abm-stable-detail/
            .cache/abm-full-detail-collect/
            .cache/abm-rebuild-detail-staging/
          retention-days: 30
          if-no-files-found: warn
