name: Check Active Promotions

on:
  push:
    branches:
      - agent/notice-legacy-migration
    paths:
      - .github/workflows/check-active-promotions.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notice-legacy-migration
          fetch-depth: 0
      - name: Query active promotions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const token=[process.env.SANITY_WRITE_TOKEN,process.env.SANITY_API_WRITE_TOKEN,process.env.SANITY_API_TOKEN,process.env.SANITY_TOKEN,process.env.SANITY_AUTH_TOKEN].find(Boolean);
          const query='*[_type == "promotion" && coalesce(isActive, true) == true]{_id,title,isActive,"slug":slug.current}';
          const url=`https://9b5twpc8.api.sanity.io/v2025-01-01/data/query/production?query=${encodeURIComponent(query)}`;
          const r=await fetch(url,{headers:token?{authorization:`Bearer ${token}`}:{}});
          if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
          const docs=(await r.json()).result||[];
          await fs.mkdir('docs/migration-reports',{recursive:true});
          await fs.writeFile('docs/migration-reports/active-promotions.json',JSON.stringify({generatedAt:new Date().toISOString(),count:docs.length,docs},null,2));
          await fs.writeFile('docs/migration-reports/active-promotions.md',['# Active Promotions','',`- Count: ${docs.length}`,'',...docs.map(x=>`- ${x._id} · ${x.title} · active=${x.isActive}`),''].join('\n'));
          console.log(JSON.stringify(docs,null,2));
          NODE
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration-reports/active-promotions.*
          git commit -m "Record active promotion state" || exit 0
          git push origin HEAD:agent/notice-legacy-migration
