name: Verify Legacy Notice State Now

# Re-run state check after the migration progressed.
on:
  push:
    branches:
      - agent/notice-legacy-migration
    paths:
      - .github/workflows/legacy-notice-verify-now.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notice-legacy-migration
          fetch-depth: 0
      - name: Query migrated Notice state
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const token=[process.env.SANITY_WRITE_TOKEN,process.env.SANITY_API_WRITE_TOKEN,process.env.SANITY_API_TOKEN,process.env.SANITY_TOKEN,process.env.SANITY_AUTH_TOKEN].find(Boolean);
          const ids=Array.from({length:20},(_,i)=>`legacy-notice-${i+15}`);
          const query=`*[_id in ${JSON.stringify(ids)}]{_id,title,"slug":slug.current,publishedAt,"bodyCount":count(body),"hasThumbnail":defined(thumbnail.asset._ref)}`;
          const url=`https://9b5twpc8.api.sanity.io/v2025-01-01/data/query/production?query=${encodeURIComponent(query)}`;
          const r=await fetch(url,{headers:token?{authorization:`Bearer ${token}`}:{}});
          if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
          const payload=await r.json();
          const docs=Array.isArray(payload.result)?payload.result:[];
          docs.sort((a,b)=>a._id.localeCompare(b._id,undefined,{numeric:true}));
          const report={generatedAt:new Date().toISOString(),found:docs.length,withThumbnail:docs.filter(x=>x.hasThumbnail).length,docs};
          await fs.mkdir('docs/migration-reports',{recursive:true});
          await fs.writeFile('docs/migration-reports/legacy-notice-state-now.json',JSON.stringify(report,null,2));
          await fs.writeFile('docs/migration-reports/legacy-notice-state-now.md',['# Legacy Notice State', '', `- Found: ${report.found}/20`, `- With thumbnail: ${report.withThumbnail}/${report.found}`, '', ...docs.map(x=>`- ${x._id} · ${x.publishedAt?.slice(0,10)||''} · body ${x.bodyCount} · thumb ${x.hasThumbnail?'yes':'no'} · ${x.title}`),''].join('\n'));
          console.log(JSON.stringify(report,null,2));
          NODE
      - name: Commit state report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration-reports/legacy-notice-state-now.*
          git commit -m "Record current legacy Notice migration state" || exit 0
          git push origin HEAD:agent/notice-legacy-migration
