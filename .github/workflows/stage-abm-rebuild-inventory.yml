name: Stage ABM rebuild inventory

on:
  push:
    branches:
      - agent/abm-full-rebuild
    paths:
      - scripts/stage-abm-rebuild-inventory.mjs
      - .github/workflows/stage-abm-rebuild-inventory.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund

      - name: Download frozen authoritative ABM census
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/abm-v5
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9037822950/zip" \
            -o .cache/abm-v5.zip
          unzip -q .cache/abm-v5.zip -d .cache/abm-v5
          node -e "const p=require('./.cache/abm-v5/products.json'),s=require('./.cache/abm-v5/services.json'); if(p.length!==5144||s.length!==251) throw new Error('Frozen census count mismatch'); console.log({products:p.length,services:s.length})"

      - name: Stage inventory only
        run: node scripts/stage-abm-rebuild-inventory.mjs --products .cache/abm-v5/products.json --services .cache/abm-v5/services.json --version 2026-08-09-search-v5 --chunk-size 25

      - name: Print report
        if: always()
        run: test -f .cache/abm-rebuild-staging/report.md && cat .cache/abm-rebuild-staging/report.md || true

      - name: Upload staging report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abm-rebuild-staging-${{ github.run_id }}
          path: .cache/abm-rebuild-staging/
          retention-days: 30
          if-no-files-found: warn
