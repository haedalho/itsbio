name: Verify ABM Stable managed images

on:
  push:
    branches:
      - agent/abm-stable-lines-completeness
    paths:
      - data/abm-stable-cell-catalog.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/abm-stable-lines-completeness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Verify exactly 1,100 managed Stable images in catalog and Sanity detail records
        run: node scripts/verify-abm-stable-managed-images.mjs
