name: Repair ABM 3D and Organoid

on:
  push:
    branches:
      - agent/abm-3d-organoid-rebuild
    paths:
      - scripts/repair-abm-3d-organoid.mjs
      - .github/workflows/repair-abm-3d-organoid.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Validate current official 3D sources and target records
        run: node scripts/repair-abm-3d-organoid.mjs
      - name: Apply current official 3D content to Sanity
        run: node scripts/repair-abm-3d-organoid.mjs --apply
      - name: Verify live ITS BIO 3D pages
        shell: bash
        run: |
          set -euo pipefail
          MATRIX="https://itsbio.vercel.app/products/abm/cellular-materials/3d-and-organoid"
          SERVICE="https://itsbio.vercel.app/products/abm/services/cell-and-antibody-services/3d-and-organoid-services"
          for attempt in $(seq 1 18); do
            echo "Production verification attempt ${attempt}/18"
            matrix_html="$(curl -fsSL --retry 2 --retry-delay 2 "$MATRIX" || true)"
            service_html="$(curl -fsSL --retry 2 --retry-delay 2 "$SERVICE" || true)"
            matrix_ok=1
            service_ok=1
            for marker in \
              "3DCelMatrix™ ECM Solution Product Highlights" \
              "Simple 5-Step 3D Cell Culture Workflow" \
              "3DCelMatrix™ Technical Specifications" \
              "Related Products for 3D Cell Culture Workflows" \
              "Frequently Asked Questions About 3DCelMatrix™"; do
              grep -Fq "$marker" <<<"$matrix_html" || matrix_ok=0
            done
            if grep -Eiq 'Early Adopter Pricing|Limited Early Access Opportunity|\$[[:space:]]*[0-9]' <<<"$matrix_html"; then matrix_ok=0; fi
            for marker in \
              "Your research, in 3D. Custom organoid models built around your science." \
              "A project-based process built around you" \
              "Comprehensive support from start to finish" \
              "Purpose-built for every stage of drug discovery and disease research" \
              "Frequently asked questions"; do
              grep -Fq "$marker" <<<"$service_html" || service_ok=0
            done
            if [[ "$matrix_ok" == 1 && "$service_ok" == 1 ]]; then
              echo "ABM 3D and Organoid live smoke checks passed."
              exit 0
            fi
            sleep 10
          done
          echo "Live verification did not converge in time." >&2
          exit 1
