name: Inspect ABM G050 G129 specs

on:
  pull_request:
    branches:
      - agent/quote-email-fields

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Inspect current Sanity specification payloads
        run: node scripts/inspect-abm-specs-g050-g129.mjs
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
