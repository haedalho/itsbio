name: Rebuild approved home hero with super resolution

on:
  push:
    branches:
      - agent/kent-sanity-images-only
    paths:
      - .github/workflows/rebuild-home-hero-original.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow opencv-contrib-python-headless==4.10.0.84

      - name: Download EDSR x4 model
        run: |
          curl -L --fail --retry 3 \
            https://github.com/Saafke/EDSR_Tensorflow/raw/master/models/EDSR_x4.pb \
            -o /tmp/EDSR_x4.pb
          test -s /tmp/EDSR_x4.pb

      - name: Restore the approved cell image with AI super resolution
        run: |
          python - <<'PY'
          import base64
          import io
          import re
          import subprocess
          from pathlib import Path

          import cv2
          from PIL import Image, ImageFilter

          source = subprocess.check_output([
              'git', 'show',
              'ef683cae2c01343fa5ea0433c39768da2822c19d:components/site/home/HomeHeroOverride.tsx'
          ], text=True)
          match = re.search(r'data:image/jpeg;base64,([^"\\]+)', source)
          if not match:
              raise SystemExit('Approved original hero data was not found')

          raw = base64.b64decode(match.group(1))
          tiny_path = Path('/tmp/approved-original.jpg')
          tiny_path.write_bytes(raw)

          image = cv2.imread(str(tiny_path), cv2.IMREAD_COLOR)
          if image is None:
              raise SystemExit('Could not decode approved original image')

          sr = cv2.dnn_superres.DnnSuperResImpl_create()
          sr.readModel('/tmp/EDSR_x4.pb')
          sr.setModel('edsr', 4)
          upscaled = sr.upsample(image)
          upscaled = cv2.cvtColor(upscaled, cv2.COLOR_BGR2RGB)
          pil = Image.fromarray(upscaled)

          # Match the website banner ratio without stretching the cell.
          target_ratio = 16 / 9
          width, height = pil.size
          crop_height = round(width / target_ratio)
          if crop_height <= height:
              top = (height - crop_height) // 2
              pil = pil.crop((0, top, width, top + crop_height))
          else:
              crop_width = round(height * target_ratio)
              left = (width - crop_width) // 2
              pil = pil.crop((left, 0, left + crop_width, height))

          pil = pil.resize((1920, 1080), Image.Resampling.LANCZOS)
          pil = pil.filter(ImageFilter.UnsharpMask(radius=1.0, percent=65, threshold=3))

          out = Path('public/images/home/itsbio-hero-approved-ai-v5.webp')
          out.parent.mkdir(parents=True, exist_ok=True)
          pil.save(out, 'WEBP', quality=94, method=6)
          print(f'created {out}: {pil.size}, {out.stat().st_size} bytes')
          PY

      - name: Upload image for visual verification
        uses: actions/upload-artifact@v4
        with:
          name: itsbio-hero-approved-ai-v5
          path: public/images/home/itsbio-hero-approved-ai-v5.webp
          if-no-files-found: error

      - name: Commit verified-resolution image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/home/itsbio-hero-approved-ai-v5.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add AI-restored approved home hero [skip ci]"
          git push
