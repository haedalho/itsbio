name: Rebuild original home hero

on:
  push:
    branches:
      - agent/kent-sanity-images-only
    paths:
      - .github/workflows/rebuild-home-hero-original.yml
      - components/site/home/HomeHeroOverride.tsx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Restore and enhance the approved original cell image
        run: |
          python - <<'PY'
          import base64
          import io
          import re
          import subprocess
          from pathlib import Path
          from PIL import Image, ImageFilter

          source = subprocess.check_output([
              'git', 'show',
              'ef683cae2c01343fa5ea0433c39768da2822c19d:components/site/home/HomeHeroOverride.tsx'
          ], text=True)
          match = re.search(r'data:image/jpeg;base64,([^"\\]+)', source)
          if not match:
              raise SystemExit('Original approved hero data was not found')

          raw = base64.b64decode(match.group(1))
          image = Image.open(io.BytesIO(raw)).convert('RGB')
          image = image.resize((2400, 2064), Image.Resampling.LANCZOS)
          image = image.filter(ImageFilter.GaussianBlur(radius=0.45))
          image = image.filter(ImageFilter.UnsharpMask(radius=1.1, percent=95, threshold=2))

          out = Path('public/images/home/itsbio-hero-original-enhanced.webp')
          out.parent.mkdir(parents=True, exist_ok=True)
          image.save(out, 'WEBP', quality=94, method=6)
          print(f'created {out} at {image.size}')
          PY

      - name: Commit enhanced image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/home/itsbio-hero-original-enhanced.webp
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild approved home hero at high resolution [skip ci]"
          git push
