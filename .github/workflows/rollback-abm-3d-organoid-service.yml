name: Rollback ABM 3D Organoid Service

on:
  push:
    branches:
      - agent/abm-3d-organoid-rebuild
    paths:
      - scripts/rollback-abm-3d-organoid-service.mjs
      - .github/workflows/rollback-abm-3d-organoid-service.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Inspect exact pre-mutation service revision
        run: node scripts/rollback-abm-3d-organoid-service.mjs
      - name: Restore exact pre-mutation service record
        run: node scripts/rollback-abm-3d-organoid-service.mjs --apply
