name: Stage ABM rebuild preview details

on:
  push:
    branches:
      - agent/abm-full-rebuild
    paths:
      - lib/abm/rebuild-parser.mjs
      - lib/abm/rebuild-parser-v2.mjs
      - scripts/stage-abm-rebuild-details.mjs
      - .github/workflows/stage-abm-rebuild-preview-details.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-preview-details:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund

      - name: Parse representative official Product and Service pages
        run: node scripts/abm-rebuild-parser-qa.mjs

      - name: Stage reviewed sample details in Sanity
        run: >-
          node scripts/stage-abm-rebuild-details.mjs
          --qa-results .cache/abm-rebuild-parser-qa/results.json
          --allow-partial
          --version 2026-08-09-search-v5

      - name: Upload QA and staging reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abm-rebuild-preview-details-${{ github.run_id }}
          path: |
            .cache/abm-rebuild-parser-qa/
            .cache/abm-rebuild-detail-staging/
          retention-days: 30
          if-no-files-found: warn
