name: Resume ABM details after missing image fix

on:
  push:
    branches:
      - agent/abm-full-rebuild
    paths:
      - .github/workflows/stage-abm-rebuild-batches-once.yml

permissions:
  contents: read
  actions: read

jobs:
  run:
    uses: ./.github/workflows/stage-abm-rebuild-full-details.yml
    with:
      workers: "2"
      gap_ms: "300"
    secrets: inherit
