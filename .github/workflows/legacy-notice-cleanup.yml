name: Clean Legacy Notice Temporary Files

on:
  push:
    branches:
      - agent/notice-legacy-migration
    paths:
      - .github/workflows/legacy-notice-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notice-legacy-migration
          fetch-depth: 0
      - name: Remove temporary migration diagnostics
        run: |
          rm -f .github/workflows/legacy-notice-connectivity.yml
          rm -f .github/workflows/legacy-notice-dom-inspect.yml
          rm -f .github/workflows/legacy-notice-fast-scan.yml
          rm -f .github/workflows/legacy-notice-finalize-code.yml
          rm -f .github/workflows/legacy-notice-http-scan.yml
          rm -f .github/workflows/legacy-notice-migration-preview.yml
          rm -f .github/workflows/legacy-notice-parser-fix.yml
          rm -f .github/workflows/legacy-notice-v2-audit.yml
          rm -f .github/workflows/legacy-notice-cleanup.yml
          rm -f docs/migration-reports/legacy-connectivity.json
          rm -f docs/migration-reports/legacy-dom-inspect.json
          rm -f docs/migration-reports/legacy-notice-fast-scan.json
          rm -f docs/migration-reports/legacy-notice-fast-scan.md
          rm -f docs/migration-reports/legacy-notices-latest.json
          rm -f docs/migration-reports/legacy-notices-latest.md
          rm -f docs/migration-reports/legacy-notices-v2-latest.json
          rm -f docs/migration-reports/legacy-notices-v2-latest.md
          rm -f scripts/migrate-legacy-notices.mjs
          rm -f scripts/patch-home-promotion-coming-soon.mjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep only production Notice migration changes"
          git push origin HEAD:agent/notice-legacy-migration
