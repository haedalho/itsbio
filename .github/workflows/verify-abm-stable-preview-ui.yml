name: Verify ABM Stable preview UI

on:
  push:
    branches:
      - agent/abm-stable-lines-completeness
    paths:
      - .github/workflows/verify-abm-stable-preview-ui.yml
      - app/products/abm/cellular-materials/cell-library-collections/stable-cell-lines/**
      - components/products/AbmSpecialCellCatalogClient.tsx
      - data/abm-stable-cell-catalog.json
      - lib/abm/special-cell-catalog.ts
      - lib/abm/stable-cell-data.ts
      - lib/abm/resource-links.ts
      - app/products/abm/resource-image/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://itsbio-git-agent-abm-stable-lines-com-d5de40-hadel-hos-projects.vercel.app
      STABLE_PATH: /products/abm/cellular-materials/cell-library-collections/stable-cell-lines
    steps:
      - name: Wait for latest Stable preview
        shell: bash
        run: |
          set -euo pipefail
          url="${BASE_URL}${STABLE_PATH}"
          for attempt in $(seq 1 24); do
            result=$(curl -L -sS --max-time 30 -o /tmp/stable.html -w '%{http_code} %{time_total}' "$url" || true)
            code=${result%% *}
            time=${result#* }
            echo "attempt=${attempt} status=${code} time=${time}s"
            if [[ "$code" == "200" ]]; then
              break
            fi
            sleep 10
          done
          [[ "$code" == "200" ]]

      - name: Verify browser-rendered Stable catalog UI
        shell: bash
        run: |
          set -euo pipefail
          url="${BASE_URL}${STABLE_PATH}"
          chrome=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)
          if [[ -z "$chrome" ]]; then
            echo 'No Chrome/Chromium binary found on runner' >&2
            exit 1
          fi
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=7000 --dump-dom "$url" > /tmp/stable-dom.html
          grep -q 'aria-current="page"' /tmp/stable-dom.html
          for number in 1 2 3 4 5; do
            grep -Eq ">${number}</button>" /tmp/stable-dom.html
          done
          grep -q 'T6352' /tmp/stable-dom.html
          grep -q 'T6352_Morphology.jpg' /tmp/stable-dom.html
          text=$(python3 - <<'PY'
from html.parser import HTMLParser
class P(HTMLParser):
    def __init__(self): super().__init__(); self.parts=[]
    def handle_data(self, data): self.parts.append(data)
p=P(); p.feed(open('/tmp/stable-dom.html', encoding='utf-8').read()); print(' '.join(' '.join(p.parts).split()))
PY
          )
          [[ "$text" == *"1,102 products"* ]]
          [[ "$text" != *"Page 1 of 92"* ]]

      - name: Verify representative image proxy
        shell: bash
        run: |
          set -euo pipefail
          source='https://www.abmgood.com/assets/product/images/cells/T6352_Morphology.jpg'
          encoded=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$source")
          result=$(curl -L -sS --max-time 30 -o /tmp/t6352-image -w '%{http_code} %{content_type} %{size_download}' "${BASE_URL}/products/abm/resource-image?u=${encoded}")
          echo "image=${result}"
          code=${result%% *}
          [[ "$code" == "200" ]]
          content_type=$(echo "$result" | awk '{print $2}')
          [[ "$content_type" == image/* ]]
          size=$(echo "$result" | awk '{print $3}')
          [[ "$size" -gt 1000 ]]

      - name: Measure warm Stable page response
        shell: bash
        run: |
          set -euo pipefail
          url="${BASE_URL}${STABLE_PATH}"
          curl -L -sS --max-time 30 -o /dev/null "$url"
          result=$(curl -L -sS --max-time 30 -o /dev/null -w '%{http_code} %{time_total} %{size_download}' "$url")
          echo "warm-page=${result}"
          code=${result%% *}
          [[ "$code" == "200" ]]
