name: Restage ABM service landing assets

on:
  push:
    branches: [agent/abm-full-rebuild]
    paths: [.github/workflows/stage-abm-service-assets-once.yml]

permissions:
  contents: read

jobs:
  restage-service-landings:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Collect official Service landing hierarchy
        run: node scripts/abm-service-landing-collect.mjs --workers 4 --gap-ms 180
      - name: Upload images and restage Service landings
        run: >-
          node scripts/stage-abm-service-landings.mjs
          --input .cache/abm-service-landings/landings.json
          --replace
          --version 2026-08-09-search-v5
