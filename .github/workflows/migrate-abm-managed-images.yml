name: Migrate approved ABM images into Sanity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-abm-managed-images.yml
      - scripts/migrate-abm-category-images-to-sanity.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abm-managed-images-production
  cancel-in-progress: false

jobs:
  migrate-approved-abm-images:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 75
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install reviewed project dependencies
        run: npm install --no-audit --no-fund
      - name: Upload official ABM category and specialty-cell images into Sanity
        run: node scripts/migrate-abm-category-images-to-sanity.mjs --brand abm
