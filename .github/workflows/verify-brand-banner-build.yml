name: Verify ABM and Kent brand banner build

on:
  push:
    branches:
      - agent/homepage-brand-redesign
    paths:
      - .github/workflows/verify-brand-banner-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homepage-brand-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
