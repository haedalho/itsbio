name: Temp pin selected Notices

on:
  push:
    branches:
      - agent/notice-html-fidelity
    paths:
      - .github/workflows/temp-pin-selected-notices.yml

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    env:
      PROJECT_ID: 9b5twpc8
      DATASET: production
      API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - name: Pin and verify only legacy Notices 33, 32, and 26
        run: |
          node <<'NODE'
          const fs = require('fs');
          const project = process.env.PROJECT_ID;
          const dataset = process.env.DATASET;
          const version = process.env.API_VERSION;
          const token = [process.env.SANITY_WRITE_TOKEN,process.env.SANITY_API_WRITE_TOKEN,process.env.SANITY_API_TOKEN,process.env.SANITY_TOKEN,process.env.SANITY_AUTH_TOKEN].find(Boolean);
          if (!token) throw new Error('No Sanity write token available');
          const expected = new Map([
            ['legacy-notice-33', '[abm] Cell Lines Special Offer'],
            ['legacy-notice-32', '[abm] OneScript® Hot 5X RT MasterMix(Cat. No. G590) – 신제품'],
            ['legacy-notice-26', 'C.B.S. Scientific 대리점'],
          ]);
          const ids = [...expected.keys()];
          async function query(groq) {
            const url = new URL(`https://${project}.api.sanity.io/v${version}/data/query/${dataset}`);
            url.searchParams.set('query', groq);
            const res = await fetch(url, { headers: { authorization: `Bearer ${token}` } });
            if (!res.ok) throw new Error(`Query HTTP ${res.status}: ${await res.text()}`);
            return (await res.json()).result;
          }
          (async()=>{
            const docs = await query(`*[_id in ${JSON.stringify(ids)}]{_id,title,isPinned,order}`);
            if (!Array.isArray(docs) || docs.length !== 3) throw new Error(`Expected 3 target docs, found ${JSON.stringify(docs)}`);
            for (const doc of docs) {
              const title = String(doc.title || '').replace(/\s+/g, ' ').trim();
              const wanted = expected.get(doc._id)?.replace(/\s+/g, ' ').trim();
              if (!wanted || title !== wanted) throw new Error(`Title mismatch for ${doc._id}: ${title}`);
            }
            const endpoint = `https://${project}.api.sanity.io/v${version}/data/mutate/${dataset}?returnIds=true`;
            const res = await fetch(endpoint, {method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({mutations:ids.map(id=>({patch:{id,set:{isPinned:true}}}))})});
            if (!res.ok) throw new Error(`Mutation HTTP ${res.status}: ${await res.text()}`);
            const after = await query(`*[_id in ${JSON.stringify(ids)}]{_id,title,isPinned,order}`);
            if (after.length !== 3 || after.some(doc => doc.isPinned !== true)) throw new Error(`Pin verification failed: ${JSON.stringify(after)}`);
            fs.mkdirSync('docs/migration-reports',{recursive:true});
            fs.writeFileSync('docs/migration-reports/pinned-notices-verified.md', '# Pinned Notices Verified\n\n' + after.map(d=>`- ${d._id} · isPinned=${d.isPinned} · ${d.title}`).join('\n') + '\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit verification report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/migration-reports/pinned-notices-verified.md
          git diff --cached --quiet || git commit -m "Verify selected Notice pins"
          git push
