name: Verify ABM 3D Product Pages

on:
  push:
    branches:
      - agent/abm-3d-organoid-rebuild
    paths:
      - .github/workflows/verify-abm-3d-product-pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify 3D product pages after cache window
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://itsbio.vercel.app/products/abm/cellular-materials/3d-and-organoid"
          PLATFORMS="$ROOT/3d-culture-platforms"
          MATRIX="$ROOT/3dcelmatrix"

          for attempt in $(seq 1 12); do
            echo "attempt ${attempt}/12"
            root_html="$(curl -fsSL --retry 2 --retry-delay 2 "$ROOT" || true)"
            platforms_html="$(curl -fsSL --retry 2 --retry-delay 2 "$PLATFORMS" || true)"
            matrix_html="$(curl -fsSL --retry 2 --retry-delay 2 "$MATRIX" || true)"

            root_ok=1
            platforms_ok=1
            matrix_ok=1

            grep -Fq '3D &amp; Organoid' <<<"$root_html" || grep -Fq '3D & Organoid' <<<"$root_html" || root_ok=0
            grep -Fq '/products/abm/cellular-materials/3d-and-organoid/3d-culture-platforms' <<<"$root_html" || root_ok=0
            grep -Fq '/products/abm/cellular-materials/3d-and-organoid/3dcelmatrix' <<<"$root_html" || root_ok=0
            grep -Fq '3D Culture Platforms' <<<"$root_html" || root_ok=0
            grep -Fq '3DCelMatrix' <<<"$root_html" || root_ok=0

            grep -Fq '3D Culture Platforms' <<<"$platforms_html" || platforms_ok=0
            grep -Fq 'SpheroWell' <<<"$platforms_html" || platforms_ok=0
            grep -Fq 'G7540' <<<"$platforms_html" || platforms_ok=0

            grep -Fq '3DCelMatrix' <<<"$matrix_html" || matrix_ok=0
            grep -Fq '3D Cell Culture' <<<"$matrix_html" || matrix_ok=0
            grep -Fq 'TM076' <<<"$matrix_html" || matrix_ok=0

            if grep -Eiq 'Early Adopter Pricing|Limited Early Access Opportunity|Add to Cart|Buy Now|\$[[:space:]]*[0-9]' <<<"$root_html$platforms_html$matrix_html"; then
              root_ok=0; platforms_ok=0; matrix_ok=0
            fi

            echo "root=${root_ok} platforms=${platforms_ok} matrix=${matrix_ok} bytes=${#root_html}/${#platforms_html}/${#matrix_html}"
            if [[ "$root_ok" == 1 && "$platforms_ok" == 1 && "$matrix_ok" == 1 ]]; then
              echo "ABM 3D product hierarchy live verification passed."
              exit 0
            fi
            sleep 20
          done

          echo "ABM 3D product live verification failed." >&2
          exit 1
