name: Inspect Cleaver preview source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-cleaver-preview.yml'
      - 'app/api/cleaver-source-probe/route.ts'
      - 'lib/cleaver/source-fixtures.ts'
      - 'components/site/FloatingQuoteButton.tsx'
      - 'app/api/quote/route.ts'
      - 'app/products/cleaver/item/**'

jobs:
  inspect:
    if: github.head_ref == 'agent/cleaver-full-thistle-sections'
    runs-on: ubuntu-latest
    steps:
      - name: Read manufacturer page through public rendered reader
        run: |
          node <<'NODE'
          const source = 'https://www.thistlescientific.com/product/multisub-mini-mini-horizontal-electrophoresis-system/';
          const response = await fetch(`https://r.jina.ai/${source}`);
          const text = await response.text();
          console.log('READER_STATUS', response.status);
          console.log('READER_BYTES', text.length);
          console.log('SOURCE_HEAD');
          console.log(text.slice(0, 12000));
          console.log('SOURCE_HEAD_END');

          const imageUrls = [...text.matchAll(/https?:\/\/[^\s)\]>]+\.(?:jpe?g|png|webp)(?:\?[^\s)\]>]*)?/gi)]
            .map((match) => match[0].replace(/&amp;/g, '&'));
          const unique = [...new Set(imageUrls)];
          const mini = unique.filter((url) => /MSMINI/i.test(url));
          console.log('ALL_MSMINI_IMAGE_COUNT', mini.length);
          mini.forEach((url, index) => console.log(`ALL_MSMINI_${index + 1}`, url));
          NODE
