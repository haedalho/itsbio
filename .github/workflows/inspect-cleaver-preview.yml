name: Inspect Cleaver preview source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-cleaver-preview.yml'
      - 'app/api/cleaver-source-probe/route.ts'
      - 'lib/cleaver/source-fixtures.ts'
      - 'components/site/FloatingQuoteButton.tsx'
      - 'app/api/quote/route.ts'
      - 'app/products/cleaver/item/**'

jobs:
  inspect:
    if: github.head_ref == 'agent/cleaver-full-thistle-sections'
    runs-on: ubuntu-latest
    steps:
      - name: Read exact manufacturer gallery through browser renderer
        run: |
          node <<'NODE'
          const source = 'https://www.thistlescientific.com/product/multisub-mini-mini-horizontal-electrophoresis-system/';
          const reader = `https://r.jina.ai/${source}`;
          const response = await fetch(reader, {
            headers: {
              'x-engine': 'browser',
              'x-respond-with': 'html',
              'x-no-cache': 'true',
              'x-timeout': '30',
            },
          });
          const html = await response.text();
          console.log('READER_STATUS', response.status);
          console.log('READER_BYTES', html.length);

          const decode = (value) => value
            .replaceAll('&quot;', '"')
            .replaceAll('&#039;', "'")
            .replaceAll('&#39;', "'")
            .replaceAll('&amp;', '&');

          const galleryImages = [];
          const figureStart = html.search(/<figure[^>]*class=["'][^"']*woocommerce-product-gallery__wrapper/i);
          if (figureStart >= 0) {
            const figureEnd = html.indexOf('</figure>', figureStart);
            const figure = html.slice(figureStart, figureEnd >= 0 ? figureEnd + 9 : figureStart + 60000);
            for (const match of figure.matchAll(/data-large_image=["']([^"']+)["']/gi)) galleryImages.push(decode(match[1]));
            if (!galleryImages.length) {
              for (const match of figure.matchAll(/<a[^>]+href=["']([^"']+\.(?:jpe?g|png|webp))(?:\?[^"']*)?["']/gi)) galleryImages.push(decode(match[1]));
            }
          }
          const exactGallery = [...new Set(galleryImages)];
          console.log('EXACT_GALLERY_COUNT', exactGallery.length);
          exactGallery.forEach((url, index) => console.log(`EXACT_GALLERY_${index + 1}`, url));

          const h1 = html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i)?.[1]?.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
          console.log('SOURCE_H1', h1 || 'NOT_FOUND');

          const allMsmini = [...html.matchAll(/https:\/\/www\.thistlescientific\.com\/wp-content\/uploads\/[^"'<>\s]+MSMINI[^"'<>\s]+\.(?:jpe?g|png|webp)/gi)]
            .map((match) => decode(match[0]));
          [...new Set(allMsmini)].forEach((url, index) => console.log(`ALL_MSMINI_${index + 1}`, url));
          NODE
