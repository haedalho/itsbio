name: Inspect Cleaver preview source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-cleaver-preview.yml'
      - 'app/api/cleaver-source-probe/route.ts'
      - 'lib/cleaver/source-fixtures.ts'
      - 'components/site/FloatingQuoteButton.tsx'
      - 'app/api/quote/route.ts'
      - 'app/products/cleaver/item/**'

jobs:
  inspect:
    if: github.head_ref == 'agent/cleaver-full-thistle-sections'
    runs-on: ubuntu-latest
    steps:
      - name: Read exact manufacturer gallery from Thistle HTML
        run: |
          node <<'NODE'
          const source = 'https://www.thistlescientific.com/product/multisub-mini-mini-horizontal-electrophoresis-system/';
          const response = await fetch(source, {
            headers: {
              'user-agent': 'Mozilla/5.0 (compatible; ITS-BIO source audit)',
              'accept-language': 'en-GB,en;q=0.9',
            },
          });
          const html = await response.text();
          console.log('SOURCE_STATUS', response.status);
          console.log('SOURCE_BYTES', html.length);

          const decode = (value) => value
            .replaceAll('&quot;', '"')
            .replaceAll('&#039;', "'")
            .replaceAll('&#39;', "'")
            .replaceAll('&amp;', '&');

          const largeImages = [...html.matchAll(/data-large_image=["']([^"']+)["']/gi)]
            .map((match) => decode(match[1]));
          console.log('DATA_LARGE_IMAGE_COUNT', largeImages.length);
          largeImages.forEach((url, index) => console.log(`DATA_LARGE_IMAGE_${index + 1}`, url));

          const galleryImages = [];
          const figureStart = html.search(/<figure[^>]*class=["'][^"']*woocommerce-product-gallery__wrapper/i);
          if (figureStart >= 0) {
            const figureEnd = html.indexOf('</figure>', figureStart);
            const figure = html.slice(figureStart, figureEnd >= 0 ? figureEnd + 9 : figureStart + 50000);
            for (const match of figure.matchAll(/data-large_image=["']([^"']+)["']/gi)) {
              galleryImages.push(decode(match[1]));
            }
            if (!galleryImages.length) {
              for (const match of figure.matchAll(/<a[^>]+href=["']([^"']+\.(?:jpe?g|png|webp))(?:\?[^"']*)?["']/gi)) {
                galleryImages.push(decode(match[1]));
              }
            }
          }
          const exactGallery = [...new Set(galleryImages)];
          console.log('EXACT_GALLERY_COUNT', exactGallery.length);
          exactGallery.forEach((url, index) => console.log(`EXACT_GALLERY_${index + 1}`, url));
          NODE
