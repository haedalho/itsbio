name: Audit ABM stable cell completeness

on:
  push:
    branches:
      - agent/abm-stable-lines-completeness
    paths:
      - data/abm-stable-cell-catalog.json
      - scripts/audit-abm-stable-cell-completeness.mjs
      - .github/workflows/audit-abm-stable-cell-completeness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      ABM_REBUILD_VERSION: "2026-08-09-search-v5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Audit Stable Cell Lines against official ABM catalog and staged detail corpus
        run: node scripts/audit-abm-stable-cell-completeness.mjs
      - name: Upload Stable completeness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abm-stable-cell-completeness-${{ github.run_id }}
          path: .cache/abm-stable-cell-completeness/
          retention-days: 30
          if-no-files-found: warn
