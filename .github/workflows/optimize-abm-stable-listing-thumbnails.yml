name: Optimize ABM Stable listing thumbnails

on:
  push:
    branches:
      - agent/abm-stable-lines-completeness
    paths:
      - .github/workflows/optimize-abm-stable-listing-thumbnails.yml
      - scripts/migrate-abm-stable-listing-thumbnails.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/abm-stable-lines-completeness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Install thumbnail optimizer
        run: npm install --no-save --no-package-lock sharp@0.34.3
      - name: Optimize only oversized official Stable thumbnails
        run: node scripts/migrate-abm-stable-listing-thumbnails.mjs
      - name: Commit managed thumbnail mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/abm-stable-cell-catalog.json
          if git diff --cached --quiet; then
            echo "No Stable thumbnail mapping changes"
          else
            git commit -m "data(abm): optimize oversized stable listing thumbnails"
            git pull --rebase origin agent/abm-stable-lines-completeness
            git push origin HEAD:agent/abm-stable-lines-completeness
          fi
