name: Audit Kent variant images

on:
  pull_request:
    branches:
      - agent/kent-preflight
    paths:
      - .github/workflows/kent-variant-image-audit.yml
      - data/kent-shop-preview-snapshot.tgz
      - scripts/kent-product-migrate.mjs

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed preview snapshot
        run: tar -xzf data/kent-shop-preview-snapshot.tgz
      - name: Compare snapshot and Sanity variant images
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('.cache/kent-shop-profiles.json', 'utf8'));
          const products = data.results || [];
          const rows = products.flatMap((product) => {
            const variants = product?.commerce?.variationPayloads || [];
            if (!variants.length) return [];
            const gallery = product?.imageUrls || [];
            const uniqueVariantImages = [...new Set(variants.map((variant) => variant.image).filter(Boolean))];
            return [{
              slug: product.slug,
              title: product.title,
              variants: variants.length,
              gallery: gallery.length,
              uniqueVariantImages: uniqueVariantImages.length,
              needsGalleryFallback: gallery.length > 1 && uniqueVariantImages.length <= 1,
            }];
          });
          const targetSlug = 'vaporizer-with-vetflo-single-channel-anesthesia-stand';
          const targetProduct = products.find((row) => row.slug === targetSlug || String(row.sourceUrl || '').includes(`/${targetSlug}/`));
          const targetVariants = targetProduct?.commerce?.variationPayloads || [];
          const output = {
            totals: {
              products: products.length,
              variantProducts: rows.length,
              withMultipleVariantImages: rows.filter((row) => row.uniqueVariantImages > 1).length,
              withOneOrNoVariantImage: rows.filter((row) => row.uniqueVariantImages <= 1).length,
              galleryFallbackCandidates: rows.filter((row) => row.needsGalleryFallback).length,
            },
            target: {
              slug: targetProduct?.slug,
              title: targetProduct?.title,
              gallery: targetProduct?.imageUrls || [],
              variants: targetVariants.map((variant) => ({
                variationId: variant.variationId,
                sku: variant.sku,
                attributes: variant.attributes,
                image: variant.image,
              })),
            },
          };
          console.log('KENT_SNAPSHOT_AUDIT_START');
          console.log(JSON.stringify(output, null, 2));
          console.log('KENT_SNAPSHOT_AUDIT_END');
          NODE

          curl --fail-with-body --silent --show-error --get \
            'https://9b5twpc8.api.sanity.io/v2025-02-19/data/query/production' \
            --data-urlencode 'query=*[_type in ["product","kentPreviewProduct"] && slug.current=="vaporizer-with-vetflo-single-channel-anesthesia-stand"]{_type,_id,title,variants[]{variantId,sku,catNo,optionSummary,imageUrl,optionValues,attributes},images[]{sourceUrl,"url":asset->url}}' \
            --output /tmp/sanity-variants.json

          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/sanity-variants.json', 'utf8'));
          console.log('KENT_SANITY_AUDIT_START');
          console.log(JSON.stringify(payload.result || [], null, 2));
          console.log('KENT_SANITY_AUDIT_END');
          NODE
