name: Audit Kent variant images

on:
  pull_request:
    branches:
      - agent/kent-preflight
    paths:
      - .github/workflows/kent-variant-image-audit.yml
      - data/kent-shop-preview-snapshot.tgz
      - scripts/kent-product-migrate.mjs

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed preview snapshot
        run: tar -xzf data/kent-shop-preview-snapshot.tgz
      - name: Capture target gallery and variant evidence
        run: |
          mkdir -p /tmp/vetflo-gallery
          curl --fail --location --silent --show-error 'https://cdn.sanity.io/images/9b5twpc8/production/ceedcc74620ed28d0c794e3c7e22da92ddc46861-700x700.png' -o /tmp/vetflo-gallery/01-main.png
          curl --fail --location --silent --show-error 'https://cdn.sanity.io/images/9b5twpc8/production/7705e521e858624ef83070fd7861b4a194ed417f-800x640.jpg' -o /tmp/vetflo-gallery/02-25000KA.jpg
          curl --fail --location --silent --show-error 'https://cdn.sanity.io/images/9b5twpc8/production/8e9bd43f672caad31e17dc5c838f6ab03f58b478-800x571.jpg' -o /tmp/vetflo-gallery/03-tubing.jpg
          curl --fail --location --silent --show-error 'https://cdn.sanity.io/images/9b5twpc8/production/3eda5f1d9e30ceadefe40095f64a44cbc8365151-414x800.jpg' -o /tmp/vetflo-gallery/04-single-channel.jpg

          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('.cache/kent-shop-profiles.json', 'utf8'));
          const slug = 'vaporizer-with-vetflo-single-channel-anesthesia-stand';
          const product = (data.results || []).find((row) => row.slug === slug || String(row.sourceUrl || '').includes(`/${slug}/`));
          if (!product) throw new Error(`Missing product: ${slug}`);
          const variants = product?.commerce?.variationPayloads || [];
          fs.writeFileSync('/tmp/vetflo-gallery/audit.json', JSON.stringify({
            slug: product.slug,
            title: product.title,
            optionGroups: product?.commerce?.optionGroups || [],
            gallery: product?.imageUrls || [],
            variants: variants.map((variant) => ({
              variationId: variant.variationId,
              sku: variant.sku,
              attributes: variant.attributes,
              image: variant.image,
            })),
          }, null, 2));
          NODE
      - name: Upload gallery evidence
        uses: actions/upload-artifact@v4
        with:
          name: vetflo-gallery-audit
          path: /tmp/vetflo-gallery
          retention-days: 1
