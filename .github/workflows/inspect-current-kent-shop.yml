name: Inspect current Kent Shop taxonomy

on:
  pull_request:
    branches:
      - agent/kent-preflight
    paths:
      - .github/workflows/inspect-current-kent-shop.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Probe Kent catalog reader sources
        shell: bash
        run: |
          set -u
          probe() {
            label="$1"
            url="$2"
            out="/tmp/kent-probe-${label}.out"
            code=$(curl --http1.1 -L --retry 2 --retry-delay 2 -sS \
              -H 'accept: text/plain,text/markdown,application/json,text/html;q=0.9,*/*;q=0.8' \
              -o "$out" -w '%{http_code}' "$url" || true)
            ctype=$(file -b --mime-type "$out" 2>/dev/null || true)
            bytes=$(wc -c < "$out" 2>/dev/null || echo 0)
            products=$(grep -Eoi 'https?://(www\.)?kentscientific\.com/products/[a-z0-9-]+/?' "$out" 2>/dev/null | sort -u | wc -l || true)
            echo "PROBE $label status=$code type=$ctype bytes=$bytes products=$products url=$url"
            head -c 500 "$out" | tr '\n' ' ' || true
            echo
          }

          probe jina_http_listing 'https://r.jina.ai/http://www.kentscientific.com/product/anesthesia/anesthesia-accessories/'
          probe jina_https_listing 'https://r.jina.ai/https://www.kentscientific.com/product/anesthesia/anesthesia-accessories/'
          probe jina_http_page2 'https://r.jina.ai/http://www.kentscientific.com/product/anesthesia/anesthesia-accessories/page/2/'
          probe jina_wp_categories 'https://r.jina.ai/http://www.kentscientific.com/wp-json/wp/v2/product_cat?per_page=100&page=1&hide_empty=false&_fields=id,parent,name,slug,count,link'
          probe google_cache_listing 'https://r.jina.ai/http://r.jina.ai/http://www.kentscientific.com/product/anesthesia/anesthesia-accessories/'
