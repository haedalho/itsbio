name: Remove Duplicate Cell Lines Notice

on:
  push:
    branches:
      - agent/notice-html-fidelity
    paths:
      - .github/workflows/remove-duplicate-cell-lines-notice.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notice-html-fidelity
          fetch-depth: 0
      - name: Remove exact duplicate non-legacy Notice
        run: |
          node --input-type=module <<'NODE'
          const token=[process.env.SANITY_WRITE_TOKEN,process.env.SANITY_API_WRITE_TOKEN,process.env.SANITY_API_TOKEN,process.env.SANITY_TOKEN,process.env.SANITY_AUTH_TOKEN].find(Boolean);
          if(!token) throw new Error('Missing Sanity write token');
          const id='7db71cc5-342c-4305-ad17-a6382df53ce2';
          const endpoint='https://9b5twpc8.api.sanity.io/v2025-01-01/data/mutate/production?returnIds=true';
          const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({mutations:[{delete:{id}}]})});
          if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
          const query='count(*[_type == "notice" && !(_id match "legacy-notice-*")])';
          const q=await fetch(`https://9b5twpc8.api.sanity.io/v2025-01-01/data/query/production?query=${encodeURIComponent(query)}`,{headers:{authorization:`Bearer ${token}`}});
          const count=(await q.json()).result;
          if(count!==0) throw new Error(`Expected zero non-legacy notices after cleanup, found ${count}`);
          console.log('Non-legacy Notice cleanup verified: 0 remaining');
          NODE
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/remove-duplicate-cell-lines-notice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time Notice dedupe workflow"
          git push origin HEAD:agent/notice-html-fidelity
