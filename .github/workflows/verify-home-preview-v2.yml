name: Verify deployed home hero and logo

on:
  push:
    branches:
      - agent/kent-sanity-images-only
    paths:
      - .github/workflows/verify-home-preview-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          mkdir -p /tmp/itsbio-preview-check
          cd /tmp/itsbio-preview-check
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Open real preview and verify assets
        working-directory: /tmp/itsbio-preview-check
        env:
          PREVIEW_URL: https://itsbio-git-agent-kent-sanity-images-only-hadel-hos-projects.vercel.app/
        run: |
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const url = process.env.PREVIEW_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1648, height: 928 }, deviceScaleFactor: 1 });
          let result;

          for (let attempt = 1; attempt <= 30; attempt += 1) {
            try {
              await page.goto(url, { waitUntil: 'networkidle', timeout: 60_000 });
              await page.waitForSelector('.itsbio-home-hero-override', { timeout: 20_000 });
              const state = await page.evaluate(() => {
                const hero = document.querySelector('.itsbio-home-hero-override');
                const bgNode = hero?.querySelector('[style*="background-image"]');
                const logo = document.querySelector('header img[alt="ITSBIO"]');
                return {
                  title: document.title,
                  heroBackground: bgNode ? getComputedStyle(bgNode).backgroundImage : null,
                  logoSrc: logo?.getAttribute('src') ?? null,
                  logoNaturalWidth: logo?.naturalWidth ?? 0,
                  logoNaturalHeight: logo?.naturalHeight ?? 0,
                };
              });

              const heroOk = state.heroBackground?.includes('itsbio-hero-clean-v6.webp');
              const logoOk = state.logoSrc?.includes('itsbio-logo-original-en-v2.png');
              if (heroOk && logoOk && state.logoNaturalWidth > 0 && state.logoNaturalHeight > 0) {
                result = { attempt, url: page.url(), ...state, heroOk, logoOk };
                break;
              }
              console.log(`attempt ${attempt}: waiting for latest deployment`, state);
            } catch (error) {
              console.log(`attempt ${attempt}: ${error.message}`);
            }
            await new Promise(resolve => setTimeout(resolve, 10_000));
          }

          if (!result) {
            await page.screenshot({ path: 'homepage-failed.png', fullPage: true });
            await browser.close();
            throw new Error('Latest verified hero and logo were not found on the deployed preview.');
          }

          const assetChecks = await page.evaluate(async () => {
            const urls = [
              '/images/home/itsbio-hero-clean-v6.webp',
              '/images/brand/itsbio-logo-original-en-v2.png',
            ];
            return Promise.all(urls.map(async path => {
              const response = await fetch(path, { cache: 'no-store' });
              return {
                path,
                status: response.status,
                contentType: response.headers.get('content-type'),
                contentLength: response.headers.get('content-length'),
              };
            }));
          });

          result.assetChecks = assetChecks;
          fs.writeFileSync('verification.json', JSON.stringify(result, null, 2));
          await page.screenshot({ path: 'homepage-verified.png', fullPage: true });
          console.log(JSON.stringify(result, null, 2));
          await browser.close();
          JS
          node verify.mjs

      - name: Upload deployed-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-home-preview-v2
          path: |
            /tmp/itsbio-preview-check/homepage-verified.png
            /tmp/itsbio-preview-check/homepage-failed.png
            /tmp/itsbio-preview-check/verification.json
          if-no-files-found: warn
