name: Audit ABM full rebuild scope

on:
  push:
    branches:
      - agent/abm-full-rebuild
    paths:
      - scripts/abm-full-census-v2.mjs
      - scripts/abm-search-probe.mjs
      - scripts/abm-search-census-v3.mjs
      - scripts/abm-validate-current-products.mjs
      - .github/workflows/audit-abm-full-rebuild.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"

    steps:
      - name: Checkout ABM rebuild branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Probe current ABM search filters
        run: node scripts/abm-search-probe.mjs

      - name: Census official ABM search index
        run: node scripts/abm-search-census-v3.mjs --gap-ms 70 --max-pages 1000

      - name: Validate all current Sanity ABM products live
        run: node scripts/abm-validate-current-products.mjs --concurrency 6 --gap-ms 40

      - name: Keep category-page census as secondary cross-check
        run: node scripts/abm-full-census-v2.mjs --concurrency 4 --gap-ms 100 --max-pages-per-seed 1200 --max-total-fetches 20000

      - name: Print summaries
        if: always()
        run: |
          for file in \
            .cache/abm-search-census-v3/summary.md \
            .cache/abm-current-validation/summary.md \
            .cache/abm-full-census/summary.md; do
            if [ -f "$file" ]; then
              echo ""
              echo "===== $file ====="
              cat "$file"
            fi
          done

      - name: Upload ABM audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abm-full-rebuild-census-${{ github.run_id }}
          path: |
            .cache/abm-search-census-v3/
            .cache/abm-current-validation/
            .cache/abm-full-census/
            .cache/abm-search-probe/
          if-no-files-found: warn
          retention-days: 30
