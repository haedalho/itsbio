name: Apply ABM LV680 vector map

on:
  push:
    branches:
      - agent/homepage-brand-redesign
    paths:
      - .github/workflows/apply-abm-lv680-vector-map.yml

permissions:
  contents: read

jobs:
  apply-lv680-vector-map:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Install temporary browser renderer
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Apply only the verified LV680 Vector Map
        run: >-
          node scripts/backfill-abm-staged-vector-map.mjs
          --apply
          --sku LV680
          --source-url https://www.abmgood.com/Lenti-SV40-tsA58-temperature-sensitive-mutant-No-Selection-Marker-Lentivirus,-High-Titer-LV680.html
          --map-url https://www.abmgood.com/vds/map/cat/164

      - name: Upload apply report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abm-lv680-vector-map-apply-${{ github.run_id }}
          path: .cache/abm-vector-map-backfill/
          retention-days: 30
          if-no-files-found: warn
