name: Collect ABM stable cell catalog

on:
  push:
    branches:
      - agent/abm-stable-lines-completeness
    paths:
      - .github/workflows/collect-abm-stable-cell-catalog.yml
      - scripts/collect-abm-stable-cell-catalog.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/abm-stable-lines-completeness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and validate official Stable Cell Lines
        env:
          ABM_STABLE_CONCURRENCY: "5"
        run: node scripts/collect-abm-stable-cell-catalog.mjs
      - name: Commit authoritative dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/abm-stable-cell-catalog.json
          if git diff --cached --quiet; then
            echo "Stable catalog is unchanged"
          else
            git commit -m "data(abm): refresh stable cell catalog"
            git push origin HEAD:agent/abm-stable-lines-completeness
          fi
