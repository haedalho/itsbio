name: Legacy Notice DOM Inspect

on:
  push:
    branches:
      - agent/notice-legacy-migration
    paths:
      - .github/workflows/legacy-notice-dom-inspect.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notice-legacy-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Inspect vid 18 DOM
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import * as cheerio from 'cheerio';
          const r=await fetch('http://itsbio.co.kr/?page_id=80&vid=18',{headers:{'user-agent':'Mozilla/5.0'}});
          const html=await r.text();
          const $=cheerio.load(html);
          const clean=v=>String(v||'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
          const candidates=[];
          $('div,section,article,table,td').each((_,el)=>{
            const text=clean($(el).text());
            if(text.length<120) return;
            const cls=$(el).attr('class')||'';
            const id=$(el).attr('id')||'';
            if(/작성자|BESTSELLING|Immortalized Canine Dermal Fibroblast|Product Highlights/i.test(text)) {
              candidates.push({tag:el.tagName,id,cls,textLength:text.length,text:text.slice(0,900),html:$(el).html()?.slice(0,1600)});
            }
          });
          candidates.sort((a,b)=>a.textLength-b.textLength);
          await fs.mkdir('docs/migration-reports',{recursive:true});
          await fs.writeFile('docs/migration-reports/legacy-dom-inspect.json',JSON.stringify(candidates.slice(0,30),null,2));
          console.log(JSON.stringify(candidates.slice(0,15),null,2));
          NODE
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration-reports/legacy-dom-inspect.json
          git commit -m "Record legacy Notice DOM inspection" || exit 0
          git push origin HEAD:agent/notice-legacy-migration
