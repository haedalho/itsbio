name: Audit ABM production rendering

on:
  push:
    branches:
      - main
    paths:
      - scripts/audit-abm-production-rendering.mjs
      - .github/workflows/audit-abm-production-rendering.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Audit visible production rendering
        run: node scripts/audit-abm-production-rendering.mjs
