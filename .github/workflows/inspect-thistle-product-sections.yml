name: Inspect Thistle product sections

on:
  push:
    branches:
      - agent/kent-summary-dedupe
    paths:
      - .github/workflows/inspect-thistle-product-sections.yml
      - scripts/inspect-thistle-product-sections.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node scripts/inspect-thistle-product-sections.mjs