name: Stage full ABM rebuild details

on:
  workflow_dispatch:
    inputs:
      workers:
        description: Concurrent official ABM requests in each batch (1-2)
        required: true
        default: "2"
        type: choice
        options: ["1", "2"]
      gap_ms:
        description: Minimum delay between requests per worker
        required: true
        default: "300"
        type: string
  workflow_call:
    inputs:
      workers:
        required: false
        default: "2"
        type: string
      gap_ms:
        required: false
        default: "300"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: abm-full-detail-staging
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.matrix.outputs.batches }}
    steps:
      - id: matrix
        name: Build resumable Product and Service batch matrix
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const batches = [];
          const size = 50;
          for (let start = 0, index = 0; start < 251; start += size, index += 1) {
            batches.push({ kind: 'service', start, count: Math.min(size, 251 - start), key: `s${String(index).padStart(3, '0')}` });
          }
          for (let start = 0, index = 0; start < 5144; start += size, index += 1) {
            batches.push({ kind: 'product', start, count: Math.min(size, 5144 - start), key: `p${String(index).padStart(3, '0')}` });
          }
          console.log(`batches=${JSON.stringify(batches)}`);
          NODE

  collect-and-stage:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJson(needs.prepare.outputs.batches) }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 180
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
      ABM_INVENTORY_FILE: .cache/abm-batch-inventory.json
      ABM_BATCH_KIND: ${{ matrix.batch.kind }}
      ABM_BATCH_START: ${{ matrix.batch.start }}
      ABM_BATCH_COUNT: ${{ matrix.batch.count }}
      ABM_BATCH_KEY: ${{ matrix.batch.key }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund

      - name: Download frozen authoritative ABM inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/abm-v5
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9037822950/zip" \
            -o .cache/abm-v5.zip
          unzip -q .cache/abm-v5.zip -d .cache/abm-v5

      - name: Build frozen inventory slice
        run: |
          node <<'NODE'
          const fs = require('fs');
          const products = JSON.parse(fs.readFileSync('.cache/abm-v5/products.json', 'utf8'));
          const services = JSON.parse(fs.readFileSync('.cache/abm-v5/services.json', 'utf8'));
          if (products.length !== 5144 || services.length !== 251) {
            throw new Error(`Frozen census mismatch: products=${products.length}, services=${services.length}`);
          }
          const start = Number(process.env.ABM_BATCH_START);
          const count = Number(process.env.ABM_BATCH_COUNT);
          const kind = process.env.ABM_BATCH_KIND;
          const g094 = products.find((row) => row.sku === 'G094-1mg');
          const orderedProducts = g094 ? [g094, ...products.filter((row) => row !== g094)] : products;
          const selectedProducts = kind === 'product' ? orderedProducts.slice(start, start + count) : [];
          const selectedServices = kind === 'service' ? services.slice(start, start + count) : [];
          if ((kind === 'product' ? selectedProducts : selectedServices).length !== count) {
            throw new Error(`${kind} ${process.env.ABM_BATCH_KEY}: expected ${count} rows`);
          }
          fs.writeFileSync(process.env.ABM_INVENTORY_FILE, JSON.stringify({
            generatedAt: '2026-08-09T12:12:28.744Z',
            products: selectedProducts,
            services: selectedServices,
            excluded: [],
            productRuns: [{ title: process.env.ABM_BATCH_KEY, complete: true }],
            serviceRuns: [{ title: process.env.ABM_BATCH_KEY, complete: true }],
          }));
          console.log(`${kind} batch ${process.env.ABM_BATCH_KEY}: ${count} rows`);
          NODE

      - id: precheck
        name: Skip an already complete exact batch
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createClient } from 'next-sanity';
          const inventory = JSON.parse(fs.readFileSync(process.env.ABM_INVENTORY_FILE, 'utf8'));
          const kind = process.env.ABM_BATCH_KIND;
          const rows = kind === 'product' ? inventory.products : inventory.services;
          const expected = new Set(rows.map((row) => `${kind}:${String(row.sku || row.url).trim().toLowerCase()}`));
          const client = createClient({
            projectId: process.env.NEXT_PUBLIC_SANITY_PROJECT_ID,
            dataset: process.env.NEXT_PUBLIC_SANITY_DATASET,
            apiVersion: process.env.NEXT_PUBLIC_SANITY_API_VERSION,
            useCdn: false,
          });
          const docs = await client.fetch('*[_type == "abmRebuildDetailChunk" && version == $version && kind == $kind]{_id,"keys":records[].key}', {
            version: '2026-08-09-search-v5',
            kind,
          });
          const prefix = `abm-rebuild-detail-${kind}-batch-${process.env.ABM_BATCH_KEY}-chunk-`;
          const keys = docs.filter((doc) => String(doc._id || '').startsWith(prefix)).flatMap((doc) => doc.keys || []);
          const actual = new Set(keys.map((key) => String(key || '').trim().toLowerCase()));
          const complete = keys.length === expected.size && actual.size === expected.size && [...expected].every((key) => actual.has(key));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `complete=${complete}\n`);
          console.log(`${process.env.ABM_BATCH_KEY}: staged=${actual.size}/${expected.size}, complete=${complete}`);
          NODE

      - id: collect
        name: Collect official details for this batch
        if: steps.precheck.outputs.complete != 'true'
        continue-on-error: true
        run: >-
          node scripts/abm-full-detail-collect-runner.mjs
          --workers ${{ inputs.workers || '2' }}
          --gap-ms ${{ inputs.gap_ms || '300' }}

      - name: Stage successful details and owned images immediately
        if: always() && steps.precheck.outputs.complete != 'true' && hashFiles('.cache/abm-full-detail-collect/products.json') != ''
        run: >-
          node scripts/stage-abm-rebuild-details.mjs
          --products .cache/abm-full-detail-collect/products.json
          --services .cache/abm-full-detail-collect/services.json
          --allow-partial
          --batch-key ${{ matrix.batch.key }}
          --version 2026-08-09-search-v5

      - name: Fail incomplete collection after staging valid records
        if: steps.precheck.outputs.complete != 'true' && steps.collect.outcome != 'success'
        run: |
          echo "Collector reported errors for batch $ABM_BATCH_KEY; valid rows were staged and this batch must be retried."
          exit 1

      - name: Upload batch reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abm-detail-${{ matrix.batch.key }}-${{ github.run_id }}
          path: |
            .cache/abm-full-detail-collect/summary.json
            .cache/abm-full-detail-collect/summary.md
            .cache/abm-full-detail-collect/product-review.json
            .cache/abm-full-detail-collect/service-review.json
            .cache/abm-rebuild-detail-staging/report.json
          retention-days: 30
          if-no-files-found: warn

  finalize:
    needs: [prepare, collect-and-stage]
    if: needs.collect-and-stage.result == 'success'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Verify all batches and remove obsolete sample chunks
        run: node scripts/finalize-abm-rebuild-detail-batches.mjs --version 2026-08-09-search-v5
      - name: Audit 5,395 internal detail links and all managed images
        run: node scripts/audit-abm-staged-links.mjs --version 2026-08-09-search-v5
      - name: Upload final audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abm-detail-final-audit-${{ github.run_id }}
          path: |
            .cache/abm-rebuild-detail-finalize/report.json
            .cache/abm-staged-link-audit/report.json
          retention-days: 30
          if-no-files-found: warn
