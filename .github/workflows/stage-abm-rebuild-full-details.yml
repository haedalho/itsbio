name: Stage full ABM rebuild details

on:
  workflow_dispatch:
    inputs:
      workers:
        description: Concurrent official ABM detail requests (1-4)
        required: true
        default: "4"
        type: choice
        options: ["1", "2", "3", "4"]
      gap_ms:
        description: Minimum delay between requests per worker
        required: true
        default: "180"
        type: string

permissions:
  contents: read

concurrency:
  group: abm-full-detail-staging
  cancel-in-progress: false

jobs:
  collect-and-stage:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 360
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund

      - name: Restore resumable read-only collector cache
        uses: actions/cache@v4
        with:
          path: .cache/abm-full-detail-collect
          key: abm-full-details-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            abm-full-details-${{ github.ref_name }}-

      - name: Collect complete official Product and Service details
        run: >-
          node scripts/abm-full-detail-collect-runner.mjs
          --workers ${{ inputs.workers }}
          --gap-ms ${{ inputs.gap_ms }}
          --resume

      - name: Collect complete official Service landing hierarchy
        run: >-
          node scripts/abm-service-landing-collect.mjs
          --workers ${{ inputs.workers }}
          --gap-ms ${{ inputs.gap_ms }}

      - name: Stage reviewed Service landing hierarchy
        run: >-
          node scripts/stage-abm-service-landings.mjs
          --input .cache/abm-service-landings/landings.json
          --replace
          --version 2026-08-09-search-v5

      - name: Stage complete reviewed detail corpus
        run: >-
          node scripts/stage-abm-rebuild-details.mjs
          --products .cache/abm-full-detail-collect/products.json
          --services .cache/abm-full-detail-collect/services.json
          --replace
          --version 2026-08-09-search-v5

      - name: Upload QA and staging reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abm-full-detail-rebuild-${{ github.run_id }}
          path: |
            .cache/abm-full-detail-collect/summary.json
            .cache/abm-full-detail-collect/summary.md
            .cache/abm-full-detail-collect/product-review.json
            .cache/abm-full-detail-collect/service-review.json
            .cache/abm-rebuild-detail-staging/report.json
            .cache/abm-service-landings/navigation.json
            .cache/abm-service-landings/report.json
            .cache/abm-service-landing-staging/report.json
          retention-days: 30
          if-no-files-found: warn
