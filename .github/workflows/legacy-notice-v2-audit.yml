name: Legacy Notice V2 Audit

on:
  push:
    branches:
      - agent/notice-legacy-migration
    paths:
      - .github/workflows/legacy-notice-v2-audit.yml
      - scripts/migrate-legacy-notices-v2.mjs

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notice-legacy-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node scripts/migrate-legacy-notices-v2.mjs
      - name: Persist v2 audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/migration-reports
          cp .cache/legacy-notice-migration-v2/latest.md docs/migration-reports/legacy-notices-v2-latest.md
          cp .cache/legacy-notice-migration-v2/latest.json docs/migration-reports/legacy-notices-v2-latest.json
          git add docs/migration-reports/legacy-notices-v2-latest.*
          git commit -m "Record legacy Notice v2 audit" || exit 0
          git push origin HEAD:agent/notice-legacy-migration
