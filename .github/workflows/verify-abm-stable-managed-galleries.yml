name: Verify ABM Stable managed galleries

on:
  push:
    branches:
      - agent/abm-stable-lines-completeness
    paths:
      - data/abm-stable-cell-catalog.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Verify Stable catalog and Sanity galleries exactly
        run: node scripts/verify-abm-stable-managed-galleries.mjs
