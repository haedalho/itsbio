name: Stage ABM Stable Cell Lines text-only details

on:
  push:
    branches:
      - agent/abm-stable-lines-completeness
    paths:
      - scripts/stage-abm-stable-text-only.mjs
      - .github/workflows/stage-abm-stable-text-only.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage-abm-stable-text-only
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Download validated 1,102-product Stable collection artifact
        uses: actions/download-artifact@v4
        with:
          name: abm-stable-full-migration-34194814279
          path: .cache
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34194814279
      - name: Stage Stable text and specifications to Sanity Production
        run: node scripts/stage-abm-stable-text-only.mjs .cache/abm-full-detail-collect/products.json
