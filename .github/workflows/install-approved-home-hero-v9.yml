name: Install exact approved home hero v9

on:
  push:
    branches:
      - agent/kent-sanity-images-only
    paths:
      - .github/workflows/install-approved-home-hero-v9.yml
      - .asset-parts/home-v9/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Restore exact approved hero and update only the background
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import re
          from io import BytesIO
          from pathlib import Path
          from PIL import Image

          parts_dir = Path('.asset-parts/home-v9')
          def read(name: str) -> str:
              return ''.join((parts_dir / name).read_text(encoding='utf-8').split())

          # These files are consecutive slices of the single original Base64 string.
          # part-04.b64 contains the correct second 10,000 characters followed by
          # duplicated data, so only its first 10,000 characters are used.
          encoded = ''.join([
              read('part-00.b64'),
              read('part-01.b64'),
              read('part-02.b64'),
              read('part-03.b64'),
              read('part-04a.b64'),
              read('part-04.b64')[:10000],
              read('part-05.b64'),
              read('part-06.b64'),
              read('part-07.b64'),
              read('part-08.b64'),
          ])
          if len(encoded) != 124644:
              raise SystemExit(f'Unexpected combined Base64 length: {len(encoded)}')

          encoded += '=' * (-len(encoded) % 4)
          raw = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = '73e332ee46bce885318b030b93a2fcc874f8802d57e98546232f021497eff987'
          if digest != expected:
              raise SystemExit(f'Hero SHA mismatch: {digest}')

          with Image.open(BytesIO(raw)) as image:
              if image.size != (1672, 600) or image.format != 'WEBP':
                  raise SystemExit(f'Unexpected hero image: format={image.format}, size={image.size}')

          target = Path('public/images/home/itsbio-main-hero-v9.webp')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(raw)

          component = Path('components/site/home/HomeHeroOverride.tsx')
          text = component.read_text(encoding='utf-8')
          text, image_count = re.subn(
              r'backgroundImage:\s*"url\(\'/images/home/[^\']+\'\)",',
              'backgroundImage: "url(\'/images/home/itsbio-main-hero-v9.webp\')",',
              text,
              count=1,
          )
          if image_count != 1:
              raise SystemExit('Could not replace the home hero image path')

          text = text.replace(
              'className="absolute inset-0 bg-cover bg-no-repeat"',
              'className="absolute inset-0 bg-no-repeat"',
              1,
          )
          text, position_count = re.subn(
              r'backgroundPosition:\s*"[^"]+",(?:\n\s*backgroundSize:\s*"[^"]+",)?',
              'backgroundPosition: "center center",\n              backgroundSize: "100% 100%",',
              text,
              count=1,
          )
          if position_count != 1:
              raise SystemExit('Could not set the exact background sizing')

          component.write_text(text, encoding='utf-8')
          print(f'Installed {target}: 1672x600, sha256={digest}')
          PY

      - name: Commit exact hero asset and code change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/home/itsbio-main-hero-v9.webp components/site/home/HomeHeroOverride.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use exact approved image as homepage hero background"
          git pull --rebase origin agent/kent-sanity-images-only
          git push origin HEAD:agent/kent-sanity-images-only
