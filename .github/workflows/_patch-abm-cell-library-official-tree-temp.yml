name: Temporary patch ABM cell library official tree
on:
  push:
    branches: [agent/logo-loading-overlay]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/logo-loading-overlay
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/_patch-abm-cell-library-official-tree-temp.mjs
      - shell: bash
        run: |
          if git diff --quiet -- 'app/products/abm/[[...path]]/page.tsx'; then
            echo 'No ABM cell library changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/products/abm/[[...path]]/page.tsx'
          git commit -m 'fix: align ABM cell library hierarchy with official catalog'
          git push origin HEAD:agent/logo-loading-overlay
