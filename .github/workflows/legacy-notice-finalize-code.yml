name: Finalize Legacy Notice Code

on:
  push:
    branches:
      - agent/notice-legacy-migration
    paths:
      - .github/workflows/legacy-notice-finalize-code.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notice-legacy-migration
          fetch-depth: 0
      - name: Preserve legacy calendar dates and render migrated body images
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('scripts/migrate-legacy-notices-v2.mjs')
          s = migration.read_text()
          old = '''  const iso = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}T${String(hh).padStart(2, "0")}:${mm}:00+09:00`;
  return Number.isNaN(Date.parse(iso)) ? undefined : new Date(iso).toISOString();'''
          new = '''  // The legacy board displays a Korean local calendar date. The current Notice UI
  // formats publishedAt with toISOString(), so keep that displayed calendar date
  // stable instead of shifting late-night KST posts to the previous UTC day.
  const iso = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}T${String(hh).padStart(2, "0")}:${mm}:00Z`;
  return Number.isNaN(Date.parse(iso)) ? undefined : new Date(iso).toISOString();'''
          if old not in s and 'keep that displayed calendar date' not in s:
            raise SystemExit('Could not patch legacy date preservation')
          s = s.replace(old, new, 1)

          old_guard = '''  const thumbnail = uploadedImages[0]
    ? { _type: "image", asset: uploadedImages[0].asset }
    : undefined;
  const body = ['''
          new_guard = '''  if (!record.body.length && !uploadedImages.length) {
    throw new Error(`Refusing empty migrated Notice vid=${record.vid}: source is image-only but no image could be archived`);
  }
  const thumbnail = uploadedImages[0]
    ? { _type: "image", asset: uploadedImages[0].asset }
    : undefined;
  const body = ['''
          if old_guard in s:
            s = s.replace(old_guard, new_guard, 1)
          migration.write_text(s)

          detail = Path('app/notice/[slug]/page.tsx')
          d = detail.read_text()
          marker = '''function fmtDate(iso?: string) {
  if (!iso) return "";
  return new Date(iso).toISOString().slice(0, 10);
}
'''
          image_renderer = '''function fmtDate(iso?: string) {
  if (!iso) return "";
  return new Date(iso).toISOString().slice(0, 10);
}

const NOTICE_PORTABLE_COMPONENTS: any = {
  types: {
    image: ({ value }: { value: any }) => {
      if (!value?.asset) return null;
      const src = urlFor(value).width(2000).fit("max").auto("format").url();
      return (
        <figure className="my-8 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
          <img src={src} alt={value?.alt || ""} className="h-auto w-full object-contain" loading="lazy" />
        </figure>
      );
    },
  },
};
'''
          if 'NOTICE_PORTABLE_COMPONENTS' not in d:
            if marker not in d:
              raise SystemExit('Could not add Notice PortableText image renderer')
            d = d.replace(marker, image_renderer, 1)
          d = d.replace('<PortableText value={doc.body} />', '<PortableText value={doc.body} components={NOTICE_PORTABLE_COMPONENTS} />')
          detail.write_text(d)
          PY
      - name: Commit final Notice code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/migrate-legacy-notices-v2.mjs app/notice/'[slug]'/page.tsx
          git commit -m "Preserve legacy Notice dates and body images" || exit 0
          git push origin HEAD:agent/notice-legacy-migration
