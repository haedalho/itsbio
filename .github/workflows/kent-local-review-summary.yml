name: Kent local review summary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/kent-preflight
          fetch-depth: 0

      - name: Export readable review summary
        run: node scripts/kent-local-review-summary.mjs

      - name: Commit summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kent-local-review-summary.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Kent local review summary"
          git push origin HEAD:agent/kent-preflight
