name: Probe ABM stable search markup

on:
  push:
    branches:
      - agent/abm-stable-lines-completeness
    paths:
      - .github/workflows/probe-abm-stable-search-markup.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-abm-stable-search-markup.mjs
