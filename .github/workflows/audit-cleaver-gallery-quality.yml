name: Audit Cleaver gallery quality

on:
  push:
    branches:
      - agent/kent-summary-dedupe
    paths:
      - .github/workflows/audit-cleaver-gallery-quality.yml
      - scripts/audit-cleaver-gallery-quality.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-cleaver-gallery-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm install sharp --no-save --no-audit --no-fund
      - run: node scripts/audit-cleaver-gallery-quality.mjs --sku=MSMINI7