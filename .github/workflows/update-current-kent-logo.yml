name: Update current Kent official logo

on:
  push:
    branches:
      - agent/homepage-brand-redesign
    paths:
      - .github/workflows/update-current-kent-logo.yml

permissions:
  contents: write

jobs:
  update-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homepage-brand-redesign
      - name: Download current logo used by Kent official header
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --user-agent 'Mozilla/5.0 (compatible; ITSBIO-Brand-Audit/1.0)' \
            'https://www.kentscientific.com/wp-content/uploads/2025/07/kents-scentific-logo.png' \
            --output public/partners/KentScientific-logo.png
          test -s public/partners/KentScientific-logo.png
          file public/partners/KentScientific-logo.png
          sha256sum public/partners/KentScientific-logo.png
      - name: Commit official Kent logo to preview branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/partners/KentScientific-logo.png; then
            echo 'Logo asset already matches current official header.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/partners/KentScientific-logo.png
          git commit -m 'Update Kent logo from current official header'
          git push origin HEAD:agent/homepage-brand-redesign
