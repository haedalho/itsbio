name: Migrate ABM Stable full galleries

on:
  push:
    branches:
      - agent/abm-stable-lines-completeness
    paths:
      - .github/workflows/migrate-abm-stable-managed-galleries.yml
      - scripts/migrate-abm-stable-managed-galleries-v2.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-abm-stable-full-galleries
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
      STABLE_GALLERY_FETCH_WORKERS: 4
      STABLE_GALLERY_IMAGE_WORKERS: 3
      STABLE_GALLERY_GAP_MS: 250
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/abm-stable-lines-completeness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Install image optimizer without changing lockfile
        run: npm install --no-save --package-lock=false sharp
      - name: Migrate all official Stable galleries and patch Sanity
        run: node scripts/migrate-abm-stable-managed-galleries-v2.mjs
      - name: Commit authoritative gallery mappings
        run: |
          git checkout -- package.json package-lock.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/abm-stable-cell-catalog.json
          if git diff --cached --quiet; then
            echo "Stable managed gallery mappings are unchanged"
          else
            git commit -m "data(abm): attach complete Stable cell galleries"
            git pull --rebase origin agent/abm-stable-lines-completeness
            git push origin HEAD:agent/abm-stable-lines-completeness
          fi
      - name: Upload gallery migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abm-stable-gallery-migration-${{ github.run_id }}
          path: .cache/abm-stable-gallery-migration/
          retention-days: 30
          if-no-files-found: warn
