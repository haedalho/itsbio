name: Verify ABM completeness repair

on:
  push:
    branches:
      - agent/abm-completeness-repair
    paths:
      - scripts/audit-abm-content-completeness-v2.mjs
      - .github/workflows/verify-abm-completeness-repair.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Verify inventory to detail 1-to-1 coverage
        run: npm run abm:staged-links:audit
      - name: Run corrected strict content audit
        run: node scripts/audit-abm-content-completeness-v2.mjs
      - name: Verify cell corpus
        run: npm run abm:cell:details:audit
      - name: Inventory remaining missing managed media
        run: node scripts/backfill-abm-staged-missing-media-all.mjs
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abm-completeness-verification-${{ github.run_id }}
          path: |
            .cache/abm-staged-link-audit/
            .cache/abm-content-completeness-v2/
            .cache/abm-missing-media-all/
          retention-days: 30
          if-no-files-found: warn
