name: Apply ABM completeness repair

on:
  push:
    branches:
      - agent/abm-completeness-repair
    paths:
      - .github/workflows/apply-abm-completeness-repair.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 9b5twpc8
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Apply targeted repairs to staged ABM detail chunks
        run: node scripts/repair-abm-completeness-defects.mjs --apply
      - name: Re-run repair as idempotency check
        run: node scripts/repair-abm-completeness-defects.mjs
      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abm-completeness-repair-apply-${{ github.run_id }}
          path: .cache/abm-completeness-repair/
          retention-days: 30
          if-no-files-found: warn
